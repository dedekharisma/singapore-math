<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Singapore Math Learning Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Lora:wght@500;600;700&display=swap">
<style>
/* Soft Blush Minimalist Learning Dashboard
   Layout idea: calm reading column beside a quiet sidebar (desktop); bottom tabs on phones.
   Tokens: warm white paper, dusty rose accent, muted sage, soft lavender, charcoal ink. Light theme by choice. */
:root {
  color-scheme: light;
  --bg: #FBF7F3;
  --surface: #FFFFFF;
  --surface-2: #FDF9F6;
  --blush: #F8E9E8;
  --blush-2: #F1D6D8;
  --rose: #A94B63;
  --rose-ink: #86384D;
  --sage: #E3ECE1;
  --sage-ink: #35583F;
  --lav: #ECE6F5;
  --lav-ink: #54447F;
  --ink: #2D292B;
  --ink-2: #5B5256;
  --ink-3: #6F666A;
  --line: #E9DED9;
  --line-2: #DCCDC7;
  --focus: #54447F;
  --ok: #2F6B3E;
  --ok-bg: #E2EFE1;
  --warn-bg: #FAF0D3;
  --warn-ink: #7A5812;
  --bad-bg: #F9E1E0;
  --bad-ink: #8A2E36;
  --hijau-bg: #E1EDDF; --hijau-ink: #2F5D3B; --hijau-line: #B9D3B7;
  --kuning-bg: #F8EDCF; --kuning-ink: #77560F; --kuning-line: #E6D298;
  --biru-bg: #E0E9F5; --biru-ink: #2B4A7A; --biru-line: #B7CAE3;
  --display: "Lora", Georgia, "Times New Roman", serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --r: 16px; --r-sm: 10px; --r-lg: 22px;
  --shadow: 0 1px 2px rgba(80, 50, 55, .05), 0 6px 20px rgba(80, 50, 55, .06);
  --side: 264px;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
#root { min-height: 100%; }
.boot { padding: 32px 20px; color: var(--ink-2); }
h1, h2, h3, h4 { font-family: var(--display); font-weight: 600; line-height: 1.25; margin: 0; text-wrap: balance; color: var(--ink); }
h1 { font-size: clamp(1.7rem, 4.6vw, 2.35rem); letter-spacing: -0.01em; }
h2 { font-size: clamp(1.3rem, 3.2vw, 1.6rem); }
h3 { font-size: 1.15rem; }
h4 { font-size: 1.02rem; font-family: var(--body); font-weight: 700; }
p { margin: 0; }
a { color: var(--rose-ink); text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:hover { color: var(--rose); }
ul, ol { margin: 0; padding-left: 1.25em; }
li + li { margin-top: .3em; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip { position: absolute; left: 12px; top: -60px; background: var(--ink); color: #fff; padding: 10px 14px; border-radius: 8px; z-index: 100; }
.skip:focus { top: 10px; }
.muted { color: var(--ink-2); }
.small { font-size: .9rem; }
.tiny { font-size: .82rem; }
.nowrap { white-space: nowrap; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 100%; }
.shell > div { min-width: 0; }
.sidebar { display: none; }
.topbar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 10px; padding: calc(10px + env(safe-area-inset-top)) 14px 10px; background: rgba(251, 247, 243, .94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); min-width: 0; }
.brand-mark { flex: none; width: 36px; height: 36px; border-radius: 11px; background: var(--rose); color: #fff; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 1.05rem; }
.brand-text { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.brand-text strong { font-family: var(--display); font-size: .98rem; letter-spacing: .01em; }
.brand-text span { font-size: .72rem; color: var(--ink-3); letter-spacing: .08em; text-transform: uppercase; }
.search { position: relative; flex: 1; min-width: 0; }
.search input { width: 100%; height: 44px; border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 0 16px 0 42px; }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }
.main { padding: 20px 16px 110px; max-width: 980px; width: 100%; margin: 0 auto; outline: none; }
.main > * + * { margin-top: 22px; }
.bottomnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); }
.bottomnav a, .bottomnav button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 54px; border: 0; background: none; text-decoration: none; color: var(--ink-2); font-size: .74rem; font-weight: 600; border-radius: 12px; cursor: pointer; }
.bottomnav [aria-current="page"] { color: var(--rose-ink); background: var(--blush); }
.sheet-back { position: fixed; inset: 0; z-index: 50; background: rgba(45, 41, 43, .35); }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; background: var(--surface); border-radius: 22px 22px 0 0; padding: 18px 16px calc(24px + env(safe-area-inset-bottom)); max-height: 80%; overflow: auto; box-shadow: 0 -10px 40px rgba(45, 41, 43, .2); }
.sheet h2 { margin-bottom: 12px; }
.sheet .navlist a { padding: 14px 12px; }
.navlist { display: flex; flex-direction: column; gap: 2px; }
.navlist a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; text-decoration: none; color: var(--ink); font-weight: 600; font-size: .98rem; min-height: 44px; }
.navlist a:hover { background: var(--blush); }
.navlist a[aria-current="page"] { background: var(--blush); color: var(--rose-ink); }
.navlist svg { flex: none; color: var(--rose); }
@media (min-width: 960px) {
  .shell { grid-template-columns: var(--side) minmax(0, 1fr); }
  .sidebar { display: flex; flex-direction: column; gap: 14px; position: sticky; top: 0; height: 100vh; overflow: auto; padding: 22px 16px; border-right: 1px solid var(--line); background: var(--surface-2); }
  .topbar { padding-left: 28px; padding-right: 28px; }
  .topbar .brand { display: none; }
  .bottomnav { display: none; }
  .main { padding: 30px 32px 80px; }
  .side-foot { margin-top: auto; font-size: .8rem; color: var(--ink-3); line-height: 1.5; }
}
@media (min-width: 560px) { .brand-text span { display: block; } }
@media (max-width: 420px) { .brand-text span { display: none; } }

/* ---------- common ---------- */
.stack { display: flex; flex-direction: column; gap: 14px; }
.stack-lg { display: flex; flex-direction: column; gap: 22px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row-between { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.grid { display: grid; gap: 14px; }
.grid-2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); }
.grid-3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); }
.card.flat { box-shadow: none; }
.card.tint-blush { background: var(--blush); border-color: var(--blush-2); box-shadow: none; }
.card.tint-sage { background: var(--sage); border-color: #C6D8C4; box-shadow: none; }
.card.tint-lav { background: var(--lav); border-color: #D8CFEA; box-shadow: none; }
.card.tint-warn { background: var(--warn-bg); border-color: #E6D298; box-shadow: none; }
.card > * + * { margin-top: 10px; }
.card h3 + p, .card h2 + p { margin-top: 6px; }
.eyebrow { font-size: .76rem; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: var(--rose-ink); }
.pagehead { display: flex; flex-direction: column; gap: 8px; }
.pagehead p { color: var(--ink-2); max-width: 66ch; }
.prose p { max-width: 68ch; }
.prose p + p { margin-top: 10px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--rose); background: var(--rose); color: #fff; font-weight: 600; cursor: pointer; text-decoration: none; font-size: .95rem; }
.btn:hover { background: var(--rose-ink); color: #fff; }
.btn.ghost { background: var(--surface); color: var(--rose-ink); border-color: var(--line-2); }
.btn.ghost:hover { background: var(--blush); color: var(--rose-ink); }
.btn.sm { min-height: 36px; padding: 0 14px; font-size: .88rem; }
.btn.danger { background: var(--surface); color: var(--bad-ink); border-color: #E3B3B4; }
.btn.danger:hover { background: var(--bad-bg); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.iconbtn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line-2); background: var(--surface); display: inline-grid; place-items: center; cursor: pointer; color: var(--rose-ink); }
.iconbtn:hover { background: var(--blush); }
.iconbtn[aria-pressed="true"] { background: var(--rose); color: #fff; border-color: var(--rose); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: .78rem; font-weight: 700; letter-spacing: .02em; border: 1px solid transparent; line-height: 1.5; white-space: nowrap; }
.chip.hijau { background: var(--hijau-bg); color: var(--hijau-ink); border-color: var(--hijau-line); }
.chip.kuning { background: var(--kuning-bg); color: var(--kuning-ink); border-color: var(--kuning-line); }
.chip.biru { background: var(--biru-bg); color: var(--biru-ink); border-color: var(--biru-line); }
.chip.neutral { background: var(--surface-2); color: var(--ink-2); border-color: var(--line-2); }
.chip.page { background: var(--lav); color: var(--lav-ink); border-color: #D8CFEA; }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.label { display: inline-flex; align-items: center; gap: 6px; font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 9px; border-radius: 6px; }
.label.pdf { background: var(--lav); color: var(--lav-ink); }
.label.enrich { background: var(--blush); color: var(--rose-ink); }
.label.ext { background: #EFEAE6; color: #5B4E45; }
.section { display: flex; flex-direction: column; gap: 10px; }
.section > header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.section > header h3 { margin-right: 4px; }
.seg { display: flex; padding: 4px; background: var(--blush); border-radius: 22px; gap: 4px; }
.seg button { flex: 1 1 0; min-height: 44px; padding: 6px 14px; line-height: 1.25; border-radius: 18px; border: 0; background: transparent; font-weight: 600; color: var(--rose-ink); cursor: pointer; font-size: .92rem; }
.seg button[aria-selected="true"], .seg button[aria-pressed="true"] { background: var(--surface); box-shadow: 0 1px 4px rgba(80, 50, 55, .15); color: var(--ink); }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
.tabs button { flex: none; min-height: 44px; padding: 0 14px; border: 0; background: none; font-weight: 600; color: var(--ink-2); cursor: pointer; border-bottom: 3px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--rose-ink); border-bottom-color: var(--rose); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .field > .lbl { font-weight: 600; font-size: .92rem; }
.input, select.input, textarea.input { width: 100%; min-height: 44px; border: 1px solid var(--line-2); background: var(--surface); border-radius: 12px; padding: 9px 12px; }
textarea.input { min-height: 96px; resize: vertical; line-height: 1.5; }
.callout { border-left: 4px solid var(--rose); background: var(--blush); padding: 12px 14px; border-radius: 0 12px 12px 0; }
.callout.sage { border-color: #7C9A83; background: var(--sage); }
.callout.lav { border-color: #8E7DB8; background: var(--lav); }
.callout.warn { border-color: #C9A445; background: var(--warn-bg); }
.callout.bad { border-color: #C46068; background: var(--bad-bg); }
.callout.ok { border-color: #5E9A6C; background: var(--ok-bg); }
.quote { font-family: var(--display); font-style: italic; font-size: 1.08rem; padding: 12px 16px; border-left: 3px solid var(--blush-2); background: var(--surface-2); border-radius: 0 12px 12px 0; }
.steps { counter-reset: s; list-style: none; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.steps li { counter-increment: s; position: relative; padding-left: 40px; margin: 0; }
.steps li::before { content: counter(s); position: absolute; left: 0; top: 1px; width: 28px; height: 28px; border-radius: 50%; background: var(--blush); color: var(--rose-ink); font-weight: 700; display: grid; place-items: center; font-size: .86rem; }
.bul { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.bul li { position: relative; padding-left: 20px; margin: 0; }
.bul li::before { content: ""; position: absolute; left: 3px; top: .62em; width: 7px; height: 7px; border-radius: 50%; background: var(--rose); opacity: .75; }
.meter { height: 10px; background: var(--blush); border-radius: 999px; overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--rose); border-radius: 999px; }
.meter.sage > i { background: #6E9277; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat b { font-family: var(--display); font-size: 1.9rem; line-height: 1.1; }
.stat span { font-size: .85rem; color: var(--ink-2); }
details.fold { border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); }
details.fold > summary { cursor: pointer; padding: 12px 14px; font-weight: 600; min-height: 44px; list-style-position: inside; }
details.fold > div { padding: 0 14px 14px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(82px + env(safe-area-inset-bottom)); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 999px; font-size: .9rem; z-index: 80; max-width: calc(100% - 32px); }
@media (min-width: 960px) { .toast { bottom: 28px; } }
.savebar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: .82rem; color: var(--ink-2); }
.savebar .pill { padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); font-weight: 600; }
.savebar .pill.ok { background: var(--ok-bg); color: var(--ok); border-color: #B7D6BC; }
.savebar .pill.warn { background: var(--warn-bg); color: var(--warn-ink); border-color: #E6D298; }

/* ---------- roadmap ---------- */
.phase-strip { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); }
.phase-tile { display: flex; flex-direction: column; gap: 4px; text-align: left; text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.phase-tile:hover { border-color: var(--rose); }
.phase-tile b { font-family: var(--display); font-size: 1.02rem; }
.phase-tile small { color: var(--ink-2); font-size: .82rem; }
.stage-list { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.stage-card { display: flex; gap: 12px; align-items: flex-start; text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; position: relative; }
.stage-card:hover { border-color: var(--rose); box-shadow: var(--shadow); color: var(--ink); }
.stage-no { flex: none; width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 1.1rem; background: var(--blush); color: var(--rose-ink); }
.stage-no.hijau { background: var(--hijau-bg); color: var(--hijau-ink); }
.stage-no.kuning { background: var(--kuning-bg); color: var(--kuning-ink); }
.stage-no.biru { background: var(--biru-bg); color: var(--biru-ink); }
.stage-card h4 { font-size: 1rem; line-height: 1.3; }
.stage-card .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.mini { display: inline-flex; align-items: center; gap: 4px; font-size: .76rem; font-weight: 600; color: var(--ink-2); }
.mapwrap { overflow: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); max-height: 70vh; }
.mapwrap svg { display: block; }
.node { cursor: pointer; }
.node rect { stroke-width: 1.5; }
.node:focus-visible rect { stroke: var(--focus); stroke-width: 3; }
.edge { fill: none; stroke: #CDBFB9; stroke-width: 1.4; }
.edge.on { stroke: var(--rose); stroke-width: 2.4; }
.edge.dim { opacity: .25; }
.node.dim { opacity: .35; }

/* ---------- stage ---------- */
.stagehead { display: flex; flex-direction: column; gap: 10px; }
.stagehead .no { font-family: var(--display); color: var(--rose); font-weight: 700; letter-spacing: .06em; }
.cpa { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); }
.cpa > div { border-radius: var(--r); padding: 14px; border: 1px solid var(--line); background: var(--surface); }
.cpa .c { background: #FBEFEF; border-color: #EFD2D4; }
.cpa .p { background: #EEF3EC; border-color: #D3E0D0; }
.cpa .a { background: #F1ECF8; border-color: #DDD3EC; }
.cpa h4 { font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 6px; }
.src-group { display: flex; flex-direction: column; gap: 6px; }
.src-group h4 { font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.src-item { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--rose-ink); text-decoration: underline; cursor: pointer; font: inherit; }
.nav2 { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.statuspick { display: flex; flex-wrap: wrap; gap: 6px; }
.statuspick button { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; font-weight: 600; font-size: .88rem; color: var(--ink-2); }
.statuspick button[aria-pressed="true"] { background: var(--rose); color: #fff; border-color: var(--rose); }
.statuspick.child button[aria-pressed="true"] { background: var(--lav-ink); border-color: var(--lav-ink); }

/* ---------- quiz ---------- */
.quiz-q { display: flex; flex-direction: column; gap: 10px; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { display: flex; gap: 10px; align-items: flex-start; text-align: left; width: 100%; min-height: 48px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; }
.opt:hover { border-color: var(--rose); }
.opt .k { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--blush); color: var(--rose-ink); font-weight: 700; display: grid; place-items: center; font-size: .82rem; }
.opt.right { background: var(--ok-bg); border-color: #8CC096; }
.opt.wrong { background: var(--bad-bg); border-color: #D69A9E; }
.opt[disabled] { cursor: default; }

/* ---------- widgets ---------- */
.widget { border: 1px dashed var(--line-2); background: var(--surface-2); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.widget .wtitle { font-weight: 700; font-size: .95rem; }
.widget .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.widget svg { max-width: 100%; height: auto; }
.widget .readout { font-weight: 600; color: var(--ink); }
.tok { cursor: pointer; }
.cell { cursor: pointer; }
.chipbtn { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); font-weight: 600; cursor: pointer; font-size: .9rem; }
.chipbtn:hover { border-color: var(--rose); }
.chipbtn[aria-pressed="true"] { background: var(--rose); color: #fff; border-color: var(--rose); }
.range { width: 100%; accent-color: var(--rose); min-height: 32px; }

/* ---------- tables ---------- */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-sm); }
table { border-collapse: collapse; width: 100%; font-size: .94rem; }
th, td { text-align: left; padding: 10px 12px; vertical-align: top; border-bottom: 1px solid var(--line); }
th { background: var(--blush); font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; color: var(--rose-ink); }
tr:last-child td { border-bottom: 0; }

/* ---------- timeline ---------- */
.timeline { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.timeline li { margin: 0; padding-left: 18px; border-left: 2px solid var(--blush-2); }
.timeline time { font-size: .8rem; color: var(--ink-3); }

@media print {
  .topbar, .sidebar, .bottomnav, .btn, .iconbtn { display: none !important; }
  body { background: #fff; }
}

:"Ukuran tiap kelompok diketahui, jumlah kelompok dicari: 12 benda dikelompokkan 3-3 → 4 kelompok.",prasyarat:"Equal groups dan pengalaman pembagian konkret.",concrete:"Siapkan 12 balok; buat kumpulan berisi 3; hitung banyak kelompok.",pictorial:"Gambar 12 titik dilingkari setiap 3 titik.",abstract:"Tuliskan 12 ÷ 3 = 4; jelaskan bahwa 4 berarti jumlah kelompok.",dialog:"“Ada dua belas balok; tiap kotak boleh diisi tiga. Jadi butuh berapa kotak?”",indikator:"Membedakan “berapa isi kelompok” dari “berapa jumlah kelompok”.",hindari:"Jangan memberi hanya satu bentuk cerita pembagian; gunakan dua interpretasi.",variasi:"Ulangi dengan total 15 dan ukuran kelompok 5.",kataKunci:"division as grouping quotitive manipulatives",sumber:[{label:"Learning Trajectories • Multiplying/Dividing",url:"https://www.learningtrajectories.org/math/learning-trajectories/multiplying-dividing",type:"riset_praktik",role:null},{label:"Khan Academy • Division as Equal Groups",url:"https://www.khanacademy.org/math/3rd-engage-ny/engage-3rd-module-1/3rd-module-1-topic-b/v/division-as-equal-groupings",type:"riset_praktik",role:null},{label:"Khan Academy • Division as Equal Groups",url:"https://www.khanacademy.org/math/3rd-engage-ny/engage-3rd-module-1/3rd-module-1-topic-b/v/division-as-equal-groupings",type:"riset_praktik",role:"penjelasan_lain"},{label:"Buka pencarian YouTube",url:"https://www.youtube.com/results?search_query=division+as+grouping+quotitive+manipulatives",type:"youtube_search",role:null}],prasyaratTahap:[35,36]},{no:42,phase:7,title:"Multiplication–Division Inverse",pdfPage:58,status:"BIRU",statusLabels:["Materi Lanjutan"],konsep:"Perkalian dan pembagian memiliki relasi terbalik dengan model kelompok/array yang sama.",prasyarat:"Memahami multiplication dan kedua makna division.",concrete:"Buat 3 baris berisi 4 benda; ubah sudut pandang: total 12, 3 kelompok, tiap 4.",pictorial:"Gambar array 3×4; tandai 12:3 dan 12:4.",abstract:"Nyatakan 3×4=12; 12÷3=4; 12÷4=3.",dialog:"“Dari dua belas, kalau ada tiga kelompok, isi tiap kelompok berapa?”",indikator:"Mampu menjelaskan relasi melalui susunan fisik, bukan hanya fact family tertulis.",hindari:"Jangan menilai benar bila anak hanya menghafal tiga persamaan tanpa makna.",variasi:"Buat cerita pembagian sharing dan grouping dari array yang sama.",kataKunci:"multiplication division inverse relationship",sumber:[{label:"MOE • Primary Mathematics Syllabus",url:"https://www.moe.gov.sg/-/media/files/primary/2021-primary-mathematics-syllabus-p1-to-p6-updated-dec-2024.pdf",type:"kurikulum",role:null},{label:"Learning Trajectories • Multiplying/Dividing",url:"https://www.learningtrajectories.org/math/learning-trajectories/multiplying-dividing",type:"riset_praktik",role:null},{label:"Buka pencarian YouTube",url:"https://www.youtube.com/results?search_query=multiplication+division+inverse+relationship",type:"youtube_search",role:null}],prasyaratTahap:[39,40,41]}],paths:[{key:"A",title:"Geometry / Geometri",pdfPage:60,status:"HIJAU",steps:[{n:1,text:"Mengenali dan mencocokkan bentuk"},{n:2,text:"Lingkaran, segitiga, persegi, persegi panjang"},{n:3,text:"Membandingkan atribut, sisi dan sudut informal"},{n:4,text:"Mengenali bentuk pada orientasi berbeda"},{n:5,text:"Menggabungkan dan memecah bentuk"},{n:6,text:"Menjelajah benda 3D"},{n:7,text:"Sifat bentuk formal sebagai lanjutan"}],kegiatan:"Gunakan puzzle bentuk: dua segitiga dapat disusun menjadi persegi pada kondisi yang sesuai. Putar segitiga agar anak tidak hanya mengenali posisi yang biasa.",dialog:"“Kenapa ini tetap segitiga walau diputar?”",indikator:"Mengenali dari sifat bentuk, bukan hafalan prototipe.",kataKunci:"preschool geometry hands on activities",sumber:[{label:"MOE • Numeracy Learning Goals",url:"https://nel.moe.edu.sg/la/numeracy/overview/",type:"kurikulum",role:null},{label:"Geometry — Eastern Connecticut State University",url:"https://www.youtube.com/watch?v=cZghiQN2U5E",type:"video_langsung",role:"video_langsung"},{label:"Cari di YouTube",url:"https://www.youtube.com/results?search_query=preschool+geometry+hands+on+activities",type:"youtube_search",role:null}]},{key:"B",title:"Spatial Reasoning / Penalaran Ruang",pdfPage:61,status:"HIJAU",steps:[{n:1,text:"Di dalam / di luar"},{n:2,text:"Di atas / di bawah"},{n:3,text:"Depan / belakang"},{n:4,text:"Dekat / jauh"},{n:5,text:"Samping / di antara"},{n:6,text:"Kiri / kanan bertahap"},{n:7,text:"Posisi relatif dari sudut pandang berbeda"},{n:8,text:"Ikuti petunjuk dan peta sederhana"}],kegiatan:"Buat lintasan boneka: letakkan mobil di bawah meja lalu di antara dua kotak; lakukan dari sudut pandang anak dan orang tua.",dialog:"“Kalau kamu berdiri di sisi lain, di mana posisi kotaknya?”",indikator:"Mengikuti dan memberi instruksi arah yang tepat.",kataKunci:"spatial reasoning preschool activities",sumber:[{label:"Stanford DREME • Spatial Relations",url:"https://dreme.stanford.edu/news/the-why-and-what-of-spatial-relations/",type:"riset_praktik",role:null},{label:"Cari di YouTube",url:"https://www.youtube.com/results?search_query=spatial+reasoning+preschool+activities",type:"youtube_search",role:null}]},{key:"C",title:"Measurement / Pengukuran",pdfPage:62,status:"HIJAU",steps:[{n:1,text:"Mengenali atribut panjang, tinggi, berat"},{n:2,text:"Perbandingan langsung dengan titik awal sama"},{n:3,text:"Urutan dan perbandingan tak langsung"},{n:4,text:"Mengukur dengan unit tidak baku"},{n:5,text:"Menggunakan unit sama besar"},{n:6,text:"Menaruh unit tanpa celah/tumpang tindih"},{n:7,text:"Satuan baku dan alat ukur sebagai lanjutan"}],kegiatan:"Ukur meja memakai balok yang sama besar. Setelah itu ulangi dengan balok berbeda ukuran untuk mendiskusikan mengapa hasil pengukuran berubah.",dialog:"“Kenapa hasilnya berbeda ketika balok yang dipakai lebih panjang?”",indikator:"Memahami unit sama besar dan deret tanpa celah.",kataKunci:"nonstandard measurement preschool",sumber:[{label:"Stanford DREME • Measurement",url:"https://dreme.stanford.edu/news/teaching-measurement-and at, lalu pindahkan ke susunan dua warna; tanyakan apakah aturan yang sama masih berlaku.",dialog:"“Apa aturan yang selalu berulang? Bisakah kamu mengganti warnanya tetapi mempertahankan aturannya?”",indikator:"Menggeneralisasi aturan lintas medium, bukan sekadar menyebut warna berikutnya.",kataKunci:"early algebra patterns preschool",sumber:[{label:"Stanford DREME • Patterns",url:"https://dreme.stanford.edu/news/teaching-young-children-pattern-and-algebra-skills/",type:"riset_praktik",role:null},{label:"Learning Trajectories • Patterns",url:"https://www.learningtrajectories.org/math/learning-trajectories/patterns-structure-and-algebraic-thinking",type:"riset_praktik",role:null},{label:"Numberblocks — Patterns, Sequences, and Code Cracking",url:"https://www.youtube.com/watch?v=dq4wLVB0Z4U",type:"video_langsung",role:"video_langsung"},{label:"Cari di YouTube",url:"https://www.youtube.com/results?search_query=early+algebra+patterns+preschool",type:"youtube_search",role:null}]}],support:{sampul:{pdfPage:1,judul:"MASTER ROADMAP SINGAPORE MATH — Dari Fondasi hingga Pembagian",fokus:"Fokus utama: usia 3–5 tahun",ringkas:"42 tahap • 7 fase • 5 jalur paralel",pendekatan:"CPA • guided play • observasi kesiapan",tujuanBesar:"Membangun pemahaman jumlah, hubungan bilangan, penalaran, pemecahan masalah, serta rasa ingin tahu— bukan sekadar menghafalkan angka dan rumus.",catatan:["Disusun dari dua materi yang identik; duplikasi dilebur, isi diperkaya dan ditata ulang.","Referensi kurikulum dan video disertakan sebagai tautan aktif dalam PDF."]},panduanMembaca:{pdfPage:2,pengantar:"Kedua materi yang diberikan memiliki judul, fase, 42 tahap, jalur paralel, contoh, dan rujukan yang sama. Karena itu, dokumen ini menggabungkannya sebagai satu kurikulum tanpa pengulangan isi yang identik, lalu menyusunnya menjadi panduan praktis yang bisa dipakai berulang.",bukanKurikulumResmi:"Dokumen ini bukan kurikulum resmi tunggal pemerintah Singapura untuk usia 3–5 tahun. Urutannya merupakan sintesis pedagogis dari EYDF 2023, NEL 2022, panduan numerasi prasekolah MOE, silabus SD MOE, dan literatur pembelajaran matematika awal.",kode:{HIJAU:"Dapat dikembangkan usia 3–5 tahun melalui permainan nyata dengan tingkat tantangan individual. Bukan tuntutan penguasaan serentak.",KUNING:"Tahap transisi. Boleh diperkenalkan bila anak tertarik dan prasyarat nyata mulai terlihat; bukan target wajib prasekolah.",BIRU:"Konsep lanjutan yang umumnya dipelajari sistematis di SD. Dikenalkan setelah dasar konseptual cukup kuat."},prinsip:["Mulai dari benda yang dipegang dan situasi keseharian, bukan lembar soal simbol.","Beberapa kemampuan berkembang paralel: sorting, counting, subitizing, bentuk dan spasial tidak perlu dipisah kaku.","Usia hanyalah petunjuk umum, bukan tolok ukur tunggal kesiapan.","Tautan “video langsung” berasal dari materi masukan; mutu serta ketersediaannya belum diverifikasi ulang satu per satu.","Tautan “Cari YouTube” adalah hasil pencarian, bukan rekomendasi terhadap setiap video yang muncul.","Utamakan video sebagai sumber belajar orang tua; untuk anak kecil, eksplorasi benda dan bermain bersama lebih penting.","Kembali ke level konkret kapan pun diperlukan; jawaban benar satu kali tidak cukup untuk menyimpulkan penguasaan."],penutup:"Semua tautan berwarna biru dapat diklik. Nama rujukan dan URL lengkap tersedia lagi di bagian sumber agar mudah disalin."},petaBesar:{pdfPage:6,pengantar:"Jalur bernomor adalah peta hubungan prasyarat utama, bukan jadwal yang harus dituntaskan berurutan satu per satu. Fair sharing, misalnya, dapat muncul dalam permainan prasekolah jauh sebelum belajar operasi pembagian. FASE KONSEP UTAMA TAHAP Fase 1 Fondasi hubungan & logika 01–05 matching • sorting • membandingkan • urutan • pola Fase 2 Fondasi number sense 06–14 urutan kata bilangan • satu-satu • kardinalitas • subitizing Fase 3 Struktur bilangan 15–20 patokan 5/10 • bagian–keseluruhan • komposisi Fase 4 Representasi operasi 21–24 number bonds • tambah dan kurang konkret Fase 5 Strategi aritmetika 25–30 counting all/on/back • doubles • make ten Fase 6 Nilai tempat & pemecahan masalah 31–34 puluhan–satuan • regrouping • bar model Fase 7 Perkalian & pembagian 35–42 fair sharing • kelompok sama • array • dua model pembagian Alur konseptual: memahami benda dan hubungan → memahami jumlah → menghubungkan simbol dan jumlah → mengurai bagian-keseluruhan → mengoperasikan → memilih strategi → nilai tempat dan struktur perkalian/pembagian. Jalur paralel: geometri, penalaran spasial, pengukuran, data, serta pola/aljabar awal dipelajari bersamaan—bukan menunggu semua tahap bilangan selesai.",alurKonseptual:"memahami benda dan hubungan → memahami jumlah → menghubungkan simbol dan jumlah → mengurai bagian-keseluruhan → mengoperasikan → memilih strategi → nilai tempat dan struktur perkalian/pembagian.",jalurParalel:"geometri, penalaran spasial, pengukuran, data, serta pola/aljabar awal dipelajari bersamaan—bukan menunggu semua tahap bilangan selesai.",ringkasFase:[{phase:1,name:"Fondasi hubungan & logika",stages:"01–05",konsepUtama:"matching • sorting • membandingkan • urutan • pola"},{phase:2,name:"Fondasi number sense",stages:"06–14",konsepUtama:"urutan kata bilangan • satu-satu • kardinalitas • subitizing"},{phase:3,name:"Struktur bilangan",stages:"15–20",konsepUtama:"patokan 5/10 • bagian–keseluruhan • komposisi"},{phase:4,name:"Representasi operasi",stages:"21–24",konsepUtama:"number bonds • tambah dan kurang konkret"},{phase:5,name:"Strategi aritmetika",stages:"25–30",konsepUtama:"counting all/on/back • doubles • make ten"},{phase:6,name:"Nilai tempat & pemecahan masalah",stages:"31–34",konsepUtama:"puluhan–satuan • regrouping • bar model"},{phase:7,name:"Perkalian & pembagian",stages:"35–42",konsepUtama:"fair sharing • kelompok sama • array • dua model pembagian"}]},bedaTarget:{pdfPage:9,prioritasPrasekolah:"Matching, sorting/classification, comparison, seriation, pattern recognition; stable counting, one-to-one correspondence, cardinality, Give-N, subitizing, conservation, quantity comparison, numeral mapping, one more/one less; anchor of five, dekomposisi bilangan kecil, part-whole, geometri, spasial, pengukuran informal, data sederhana, serta berbagi adil konkret.",transisi:"Ten-frame, komposisi/dekomposisi sampai 10, missing parts, number bonds, cerita tambah–kurang, counting all/on awal, dan equal groups konkret. Terpapar konsep bukan berarti dituntut lancar secara simbolik.",lanjutan:"Operasi tertulis lebih sistematis; counting back/think addition lanjut; doubles, near doubles, make ten, mental calculation; unitizing ten, place value, regrouping, formal bar models; repeated addition, arrays, perkalian, division by sharing/grouping, dan relasi invers.",makeTen:"Agar 8 + 5 dimengerti melalui strategi make ten, anak perlu memahami 8 butuh 2 agar menjadi 10 serta 5 dapat dipecah menjadi 2 dan 3; maka 8 + 5 = (8 + 2) + 3 = 13. Tanpa kedua ide ini, langkahnya hanya menjadi prosedur.",miskonsepsi:"Bisa menyebut “1–20” ≠ memahami 20 objek. Mengenali simbol “8” ≠ dapat menghasilkan 8 benda. Berhasil mengikuti langkah penjumlahan ≠ memahami mengapa dua bagian membentuk total. Kelancaran satu soal ≠ kesiapan untuk lembar kerja abstrak."},cpaGuidedPlay:{pdfPage:65,pengantar:"CPA adalah Concrete – Pictorial – Abstract. Bukan berarti anak wajib melewati tiga langkah dalam satu hari; model dapat bolak-balik sesuai kebutuhan. Untuk anak prasekolah, benda nyata dan percakapan bermakna adalah inti pengalaman.",concrete:"Anak memegang, menggeser, mengelompokkan, membagikan, menghitung, dan membandingkan benda. Contoh: Lima balok disusun lalu dibagi 2 merah + 3 biru.",pictorial:"Anak melihat/membuat gambar yang mewakili jumlah atau hubungan nyata. Contoh: Lima titik digambar sebagai 2 titik dan 3 titik.",abstract:"Anak menyebut struktur matematika dan, bila siap, mengenali simbol. Contoh: 5 = 2 + 3; dibahas setelah maknanya jelas.",prinsipUtama:"Jangan memulai dari worksheet, algoritme, atau kecepatan jawaban. Permainan berpemandu (“guided play”) artinya orang tua menyiapkan tujuan/alat, tetapi memberi ruang pilihan, eksplorasi, dan penjelasan anak.",visualTenFrame7:"Anak dapat melihat: baris atas berisi lima, baris bawah dua; tujuh adalah lima dan dua, masih ada tiga tempat untuk menjadi sepuluh.",visualNumberBond5:"Keseluruhan lima dapat dibagi menjadi dua dan tiga. Lingkaran “5” adalah total yang sama, bukan kelompok tambahan yang terpisah.",rujukan:[{page:65,label:"MOE • Panduan CPA",url:"https://nel.moe.edu.sg/la/numeracy/how-can-you-do-it-/using-concrete-pictorial-abstract--cpa--approach/",type:"kurikulum"}]},observasiKesiapan:{pdfPage:66,pengantar:"Lima pemeriksaan berikut membantu melihat pemahaman lintas representasi. Lakukan pada saat bermain, tanpa memaksa anak menjawab dan tanpa memberi nilai berdasarkan satu kesempatan.",lima:[{nama:"Show Me",ucapan:"“Coba tunjukkan lima benda.”",diamati:"Perhatikan apakah anak dapat menunjukkan jumlah."},{nama:"Make It",ucapan:"“Bisa buat lima dari balok ini?”",diamati:"Perhatikan apakah anak menghasilkan tepat lima dan berhenti."},{nama:"Tell Me",ucapan:"“Bagaimana kamu tahu ada lima?”",diamati:"Perhatikan strategi anak: menunjuk, melihat pola, atau membandingkan."},{nama:"Show Another Way",ucapan:"“Bisa buat lima dengan dua warna?”",diamati:"Perhatikan komposisi alternatif 1+4, 2+3, dan sebagainya."},{nama:"Use It Somewhere New",ucapan:"“Coba cari lima benda lain di dapur.”",diamati:"Perhatikan apakah pemahaman pindah lintas konteks."}],tandaSiap:["Dapat menerapkan konsep pada beberapa jenis benda dan situasi.","Tidak hanya meniru jawaban atau mengingat kartu tertentu.","Mampu menunjukkan atau menjelaskan alasannya dengan cara anak sendiri.","Menggunakan konsep secara spontan di luar kegiatan terarah.","Tetap nyaman, merasa aman untuk salah, dan tertarik mengeksplorasi."],jikaBelum:"Turunkan jumlah objek, sederhanakan aturan, kembali ke benda konkret, berikan contoh bersama, lalu amati lagi di kesempatan lain. Variasi normal cukup besar; hindari membandingkan anak dengan daftar capaian teman sebaya.",lembarCatatanKolom:["TANGGAL","KONSEP / AKTIVITAS","STRATEGI ANAK / CATATAN"]},rencanaMingguan:{pdfPage:67,pengantar:"Untuk usia 3–5 tahun, kegiatan terarah sekitar 10–20 menit dapat dijadikan patokan fleksibel selama anak tertarik; bukan target wajib. Kegiatan numerasi dapat hadir selama menyiapkan makanan, merapikan mainan, berbicara tentang bentuk, atau perjalanan keluarga.",hari:[{hari:"SENIN",fokus:"Counting & number sense",contoh:"Hitung 3–5 balok, cari jumlahnya, lalu buat kumpulan sesuai permintaan."},{hari:"SELASA",fokus:"Sorting, patterns & geometry",contoh:"Sortir benda dua warna, susun pola AB, cari segitiga di rumah."},{hari:"RABU",fokus:"Subitizing & part-whole",contoh:"Main kartu titik 1–3, buat lima dari dua kelompok balok."},{hari:"KAMIS",fokus:"Measurement & spatial",contoh:"Bandingkan panjang pita, letakkan boneka di bawah/di antara kotak."},{hari:"JUMAT",fokus:"Number stories & pemecahan masalah",contoh:"Ceritakan 3 mobil datang 1; peragakan dan jelaskan jumlah."},{hari:"SABTU",fokus:"Permainan bebas matematika",contoh:"Lego, domino, dadu besar, konstruksi, bermain toko."},{hari:"MINGGU",fokus:"Rutinitas keluarga",contoh:"Bagikan sendok adil, hitung buah, tata meja dan piring."}],siklusPengantar:"Siklus ini bukan target empat minggu untuk “menuntaskan materi”. Tujuannya memberi inspirasi yang dapat diulang pada level lebih mudah atau lebih menantang.",siklus:[{pekan:1,tema:"Kesamaan, pengelompokan & pasangan",permainan:"Kaus kaki berpasangan, sorting warna dan ukuran, pola AB.",pertanyaan:"“Apa yang sama? Bagaimana kelompoknya?”"},{pekan:2,tema:"Hitung bermakna & jumlah",permainan:"Hitung sambil memindahkan benda, tanyakan total, minta 1–5 item.",pertanyaan:"“Semua ada berapa? Bisa ambil tiga?”"},{pekan:3,tema:"Titik, jari & hubungan bilangan",permainan:"Dadu 1–3, five-frame, dua bagian membentuk 4–5.",pertanyaan:"“Bagaimana kamu melihat empat?”"},{pekan:4,tema:"Cerita konkret & jalur paralel",permainan:"Benda datang/pergi, berbagi adil, bentuk, lokasi, pengukuran.",pertanyaan:"“Kamu bisa tunjukkan caranya?”"}],satuKegiatanBanyakTujuan:"Menyusun meja makan dapat melatih matching (satu sendok per piring), one-to-one (jumlah sendok), cardinality (berapa semuanya), comparison (lebih banyak/kurang), serta fair sharing (membagi buah secara adil). Ini lebih efisien dan alami daripada memisahkan seluruh kemampuan menjadi “pelajaran” sendiri-sendiri."},toolkit:{pdfPage:68,bahan:[{bahan:"Balok besar / Lego berukuran aman",kegunaan:"Sorting, matching, pola, counting, part-whole, equal groups, arrays."},{bahan:"Piring atau mangkuk plastik",kegunaan:"Matching, one-to-one, fair sharing, grouping, perkalian konkret."},{bahan:"Kartu titik buatan sendiri",kegunaan:"Subitizing perceptual dan conceptual, quantity comparison."},{bahan:"Jari tangan",kegunaan:"Patokan lima, tambah satu/kurang satu, dekomposisi."},{bahan:"Stik es krim & karet/pita",kegunaan:"Seriation, pengukuran, unitizing ten (hanya untuk anak yang aman menggunakan)."},{bahan:"Kertas, pensil, dan stiker",kegunaan:"Gambar himpunan, pola, pictograph, number bonds."},{bahan:"Kotak telur atau bingkai 5/10",kegunaan:"One-to-one, five-frame, ten-frame, array."},{bahan:"Boneka dan mainan figur",kegunaan:"Cerita matematis, spasial, perbandingan, fair sharing."}],keselamatan:"Untuk anak kecil, hindari objek mini yang berisiko tersedak (kancing, manik kecil, magnet kecil, atau komponen lepasan), gunakan alternatif besar, dan dampingi saat belajar. Hindari permainan menghitung makanan jika membuat anak tertekan harus menghabiskan atau membagi makanan tertentu."},delapanPrioritas:{pdfPage:69,prioritas:[{n:1,judul:"Kerangka Singapura",isi:"Baca NEL Educators’ Guide; pahami tujuan numerasi prasekolah dan penggunaan benda.",tautanTeks:"MOE • NEL Educators’ Guide",tautan:[{label:"MOE • NEL Educators’ Guide",url:"https://nel.moe.edu.sg/tl/all-resources/educators--guide-for-numeracy-/"}]},{n:2,judul:" m komersial: Dimensions Math • Program Comparison Bacaan penelitian Early Numeracy Assessment — Purpura & Lonigan Pengembangan Preschool Numeracy Scales dan komponen pengukuran numerasi dini. Purpura & Lonigan • Preschool Numeracy Scales Early Numeracy Skills Review Tinjauan hubungan keterampilan numerasi dan proses kognitif terkait. Riset • Early Numeracy Review Preschool Mathematics and Later Achievement Hubungan kemampuan matematika prasekolah dengan performa matematika kemudian. Riset • Preschool Mathematics and Later Achievement NAEYC/NCTM: Early Childhood Mathematics, Promoting Good Beginnings Prinsip matematika usia dini yang sesuai perkembangan, kaya interaksi, dan bermakna. NAEYC/NCTM • Promoting Good Beginnings"},glosarium:{pdfPage:74,istilah:[{istilah:"Matching",makna:"Memasangkan objek berdasarkan identitas, sifat, fungsi atau keterhubungan."},{istilah:"Sorting / classification",makna:"Membuat kumpulan menurut aturan pengelompokan."},{istilah:"Seriation",makna:"Mengurutkan objek menurut atribut yang bergradasi."},{istilah:"Stable order",makna:"Urutan kata bilangan yang konsisten."},{istilah:"One-to-one",makna:"Satu kata bilangan untuk setiap benda tepat sekali."},{istilah:"Cardinality",makna:"Kata bilangan terakhir menyatakan total benda yang dihitung."},{istilah:"Give-N",makna:"Mengambil atau membuat persis N benda sesuai permintaan."},{istilah:"Subitizing",makna:"Mengenali kuantitas kecil tanpa hitung satu per satu; dapat berbasis pola kelompok."},{istilah:"Conservation",makna:"Jumlah tak berubah saat hanya susunan benda yang diubah."},{istilah:"Composition / decomposition",makna:"Membentuk dan memecah bilangan menjadi bagian-bagian."},{istilah:"Part–whole",makna:"Hubungan keseluruhan dengan bagian pembentuknya."},{istilah:"Five-frame / ten-frame",makna:"Bingkai 5 / 10 kotak untuk melihat struktur jumlah."},{istilah:"Number bond",makna:"Diagram yang menunjukkan keseluruhan dan bagian-bagiannya."},{istilah:"Counting all / counting on",makna:"Menghitung ulang semua benda / melanjutkan dari jumlah yang sudah diketahui."},{istilah:"Unitizing",makna:"Memperlakukan sekelompok satuan sebagai satu unit baru; contohnya 10 satuan menjadi 1 puluhan."},{istilah:"Place value",makna:"Nilai suatu digit mengikuti posisi satuan, puluhan, dan seterusnya."},{istilah:"Regrouping",makna:"Menukar unit setara, misalnya 10 satuan dengan 1 puluhan."},{istilah:"Bar model",makna:"Diagram batang untuk menunjukkan hubungan bagian, total, dan perbandingan."},{istilah:"Array",makna:"Susunan teratur objek dalam baris dan kolom."},{istilah:"Partitive division",makna:"Berbagi dengan jumlah kelompok diketahui, isi setiap kelompok dicari."},{istilah:"Quotitive division",makna:"Mengelompokkan dengan ukuran setiap kelompok diketahui, jumlah kelompok dicari."},{istilah:"CPA",makna:"Concrete–Pictorial–Abstract: benda → gambar → simbol, dengan perpindahan fleksibel."}]},fiveFrame:{pdfPage:75,petunjuk:"Gunakan manik besar, balok, kertas titik, atau tanda X. Mintalah anak membentuk 2, 3, 4, 5 dan menjelaskan berapa kotak yang kosong. Jangan gunakan benda kecil yang berisiko tertelan.",contoh:[0,2,3,4,5],pertanyaanPemandu:"“Ada berapa yang terisi? Berapa yang kosong? Bagaimana caramu tahu?”"},tenFrame:{pdfPage:76,petunjuk:"Tutup kotak dengan balok atau stiker. Untuk anak yang siap: “Tujuh adalah lima dan berapa lagi? Kurang berapa agar penuh menjadi sepuluh?”",contoh:[0,5,7,8,10],tautan:[{page:76,label:"IES • Teaching Math Toolkit",url:"https://ies.ed.gov/ncee/rel/math-young-children",type:"riset_praktik"},{page:76,label:"MOE • NEL Educators’ Guide",url:"https://nel.moe.edu.sg/tl/all-resources/educators--guide-for-numeracy-/",type:"kurikulum"}]},kartuDialog:{pdfPage:77,kartu:[{judul:"LIHAT",dialog:"“Apa yang kamu perhatikan?”"},{judul:"PASANGKAN",dialog:"“Mana yang punya pasangan?”"},{judul:"KELOMPOKKAN",dialog:"“Apa aturan kelompokmu?”"},{judul:"HITUNG",dialog:"“Bagaimana kamu tahu jumlahnya?”"},{judul:"BANDINGKAN",dialog:"“Mana lebih banyak? Kenapa?”"},{judul:"URUTKAN",dialog:"“Yang paling pendek di mana?”"},{judul:"UBAH",dialog:"“Kalau dipindahkan, jumlahnya berubah?”"},{judul:"BAGI",dialog:"“Bisa dibagikan sama banyak?”"},{judul:"CARI CARA LAIN",dialog:"“Bisakah dibuat dengan cara berbeda?”"},{judul:"CERITAKAN",dialog:"“Ceritakan caramu berpikir.”"}]},ringkasanAkhir:{pdfPage:78,ringkasan:"Untuk usia 3–5 tahun, hasil yang paling berharga adalah anak bisa mengenali hubungan, memilah, membandingkan, memahami kuantitas, menghitung satu-satu, mengetahui total, mengenali pola kecil, membentuk dan mengurai bilangan, menjelaskan alasan, dan menikmati matematika. Anak yang benar-benar memahami bahwa 7 = 5 + 2 = 4 + 3 = 6 + 1 sedang membangun landasan pemahaman operasi, lebih mendalam daripada sekadar dapat menulis sederet angka atau menghafalkan jawaban cepat.",alur:["PAHAMI BENDA","PAHAMI JUMLAH","PAHAMI HUBUNGAN BILANGAN","PAHAMI BAGIAN DAN KESELURUHAN","PAHAMI OPERASI","PAHAMI STRATEGI","PAHAMI STRUKTUR MATEMATIKA"],penutup:"Kecepatan menuntaskan kurikulum bukan tolok ukur utama. Pembelajaran bermakna memberi anak waktu untuk bereksperimen, salah, bertanya, dan menjelaskan.",disclaimer:"Disusun sebagai referensi keluarga, bukan instrumen diagnosis perkembangan. Seluruh tanggal, edisi, dan tautan bibliografi mengikuti materi masukan; periksalah informasi penerbit ketika akan membeli buku atau mengadopsi versi kurikulum tertentu."}}};var Tn={1:{tujuan:"Anak mampu menemukan pasangan dua benda dan memperhatikan benda yang tidak memperoleh pasangan, tanpa perlu berhitung.",definisi:"Matching (memasangkan) adalah menghubungkan satu benda dengan satu benda lain karena sama atau saling berkaitan. Pada tahap ini belum ada bilangan; yang dilatih adalah melihat hubungan.",mengapa:"Memasangkan satu dengan satu adalah akar dari berhitung dan perbandingan jumlah. Anak yang terbiasa bertanya “apakah semuanya kebagian?” sedang menyiapkan pemahaman “lebih banyak, lebih sedikit, sama banyak”.",penjelasan:["Pasangan dapat dibentuk dari banyak hubungan: sama (dua kaus kaki), berkaitan (tutup dengan botol), atau satu-untuk-satu (satu boneka, satu kursi). Variasi hubungan ini menjaga anak tidak mengira “pasangan” selalu berarti “warnanya sama”.","Bagian terpenting ada pada sisa. Ketika empat kursi dipasangkan dengan tiga boneka, satu kursi tersisa. Menyadari yang tersisa adalah gagasan perbandingan jumlah yang paling awal, jauh sebelum anak tahu angka."],visual:{type:"pair",a:3,b:4,aLabel:"boneka",bLabel:"kursi"},visualCatatan:"Tarik garis satu-untuk-satu. Perhatikan siapa yang tidak kebagian.",simbolik:"Belum ada simbol matematika. Cukup bahasa: “sama”, “berbeda”, “pasangan”, “tersisa”, “kebagian”.",contoh:{situasi:"Tiga boneka dan empat kursi.",langkah:["Letakkan boneka dan kursi di lantai. Tanya: “Apakah semua boneka dapat tempat duduk?”","Minta anak mendudukkan satu boneka di satu kursi.","Tanya: “Siapa yang tersisa? Kursi atau boneka?”","Ubah jumlahnya (tiga kursi untuk empat boneka) dan minta anak menjelaskan sisa."],hasil:"Anak menunjuk benda yang tidak memperoleh pasangan dan menyebutnya dengan kata sendiri."},kesalahan:["Memasangkan hanya berdasarkan warna, padahal PDF menyarankan variasi ukuran, bentuk, fungsi, dan korespondensi.","Langsung mengajak menghitung; pada tahap ini anak cukup memasangkan dan menjelaskan."],ringkasan:["Memasangkan adalah dasar perbandingan jumlah.","Variasikan jenis hubungan, bukan hanya warna.","Perhatikan yang tersisa; itu pelajaran pentingnya."],refleksi:["Dalam kegiatan memasangkan hari ini, hubungan apa saja yang sudah kita pakai selain warna?","Apakah anak memperhatikan benda tersisa tanpa saya tunjukkan?"],latihan:[{q:"Anak memasangkan semua sepatu kanan dengan kirinya. Apa yang paling perlu ditanyakan berikutnya?",o:["“Ada berapa pasang? Hitung sampai 20.”","“Apakah semua sepatu kebagian pasangan? Ada yang tersisa?”","“Tulis angka pasangan di buku.”"],a:1,e:"Pertanyaan tentang kebagian dan sisa menumbuhkan pemahaman korespondensi satu-satu, bukan hafalan."},{q:"Mengapa PDF menyarankan variasi hubungan, tidak hanya warna?",o:["Agar anak tidak mengira “pasangan” hanya berarti “warna sama”.","Agar kegiatan lebih sulit.","Karena warna tidak penting."],a:0,e:"Hubungan beragam (ukuran, fungsi, satu-untuk-satu) memperluas konsep korespondensi."}],tujuanKegiatan:"Anak memasangkan benda dengan beragam hubungan dan menyebutkan benda yang tidak kebagian.",alat:["Kaus kaki atau sandal","Botol dan tutup","Boneka dan kursi kecil","Sendok dan piring"],persiapan:"Kumpulkan benda rumah yang berpasangan, campur dalam keranjang. Sengaja siapkan satu benda yang tidak punya pasangan.",langkah:["Ajak anak “membantu” memasangkan benda dari keranjang.","Setelah selesai, tanya: “Ada yang belum dapat pasangan?”","Ganti hubungan: botol–tutup, lalu sendok–piring.","Mainkan satu boneka satu kursi dengan jumlah tidak sama dan minta anak menjelaskan."],sederhana:"Mulai dengan dua atau tiga pasang dan hubungan “sama persis” (kaus kaki) sebelum hubungan berkaitan.",observasi:"Catat apakah anak memperhatikan yang tersisa dan apakah ia memasangkan tidak hanya berdasarkan warna."},2:{tujuan:"Anak mengelompokkan benda berdasarkan satu aturan lalu mengganti aturan, dan mampu menyebutkan alasannya.",definisi:"Sorting (klasifikasi) adalah mengelompokkan benda berdasarkan atribut atau aturan tertentu. Kumpulan yang sama dapat dikelompokkan dengan aturan berbeda.",mengapa:"Mengelompokkan melatih anak memperhatikan atribut dan menyatakan aturan. Keterampilan ini kelak muncul pada himpunan, data, dan pola.",penjelasan:["Kata kuncinya adalah aturan. Anak menyebut “yang merah di sini” atau “yang bisa berjalan di sini”. Aturan yang konsisten itu benar, walaupun berbeda dari aturan orang tua.","Gagasan penting: satu kumpulan dapat dikelompokkan lebih dari satu cara. Menggeser dari warna ke bentuk, lalu ke fungsi, melatih fleksibilitas berpikir."],visual:{type:"sort"},visualCatatan:"Ganti aturan (warna, bentuk, ukuran) dan lihat bagaimana kelompoknya berubah.",simbolik:"Belum ada simbol. Cukup kalimat aturan: “Ini semua merah”, “Ini semua bisa berjalan”.",contoh:{situasi:"Sekotak balok berbagai warna dan bentuk.",langkah:["Minta anak mengelompokkan balok sesuka hatinya, lalu tanya aturannya.","Ajak mengelompokkan lagi dengan aturan baru.","Mainkan “aturan rahasia”: Anda mengelompokkan empat benda, anak menebak aturannya.","Bila anak siap, coba dua atribut sekaligus (merah dan besar) dengan bantuan."],hasil:"Anak menyebut aturan pengelompokan dan dapat mengganti dengan aturan lain."},kesalahan:["Menyebut pengelompokan anak salah padahal aturannya konsisten (PDF).","Selalu memakai aturan warna; padukan dengan bentuk, ukuran, dan fungsi."],ringkasan:["Kelompok dibentuk oleh aturan.","Satu kumpulan, banyak cara mengelompokkan.","Dengarkan alasan anak, jangan menilai hasil."],refleksi:["Aturan apa yang dibuat anak yang tidak terpikir oleh saya?","Kapan terakhir saya menanyakan “bisa dikelompokkan dengan cara lain?”"],latihan:[{q:"Anak mengelompokkan mobil menurut “yang ada rodanya besar”. Respons terbaik…",o:["“Salah, harusnya menurut warna.”","“Ceritakan aturanmu. Kalau mobil ini, ke mana?”","Diam dan mengganti kegiatan."],a:1,e:"Selama aturan konsisten, kelompok itu benar. Menanyakan aturan memperdalam pemahaman."},{q:"Tujuan permainan “aturan rahasia” adalah…",o:["Menguji ingatan anak.","Melatih menemukan aturan dari contoh.","Menghitung jumlah benda."],a:1,e:"Anak menebak aturan dari kelompok yang diberikan; ini melatih penalaran atribut."}],tujuanKegiatan:"Anak mengelompokkan benda dengan aturan sendiri, lalu mengganti aturan.",alat:["Balok atau tutup botol aneka warna dan bentuk","Beberapa mobil dan hewan mainan","Dua baskom atau piring besar"],persiapan:"Campur 10–12 benda dalam satu kotak. Siapkan dua piring sebagai “rumah kelompok”.",langkah:["Beri kebebasan anak mengelompokkan lalu tanya aturan.","Minta cara lain: “Bisakah kita kelompokkan dengan cara berbeda?”","Mainkan aturan rahasia sebanyak dua putaran, lalu bertukar peran.","Gambarkan satu pengelompokan di kertas bersama."],sederhana:"Gunakan benda dengan satu perbedaan jelas (merah dan biru) sebelum menambah atribut.",observasi:"Catat aturan yang disebut anak, dan apakah ia mampu mengganti aturan.",jalur:[{k:"D",alasan:"Mengelompokkan adalah langkah awal mengorganisasi data."}]},3:{tujuan:"Anak membandingkan benda berdasarkan satu atribut yang diminta dan memberi alasan dengan perbandingan langsung.",definisi:"Attribute comparison adalah membandingkan sifat benda: panjang, tinggi, berat, besar, banyak. Perbandingan yang adil memerlukan titik awal yang sama.",mengapa:"Ini adalah dasar pengukuran dan seriasi. Anak belajar bahwa “lebih panjang” harus dibuktikan, bukan ditebak dari kesan.",penjelasan:["Perbandingan langsung berarti benda ditempatkan berdampingan dengan titik awal yang sama. Dua pita yang diluruskan dari garis yang sama dapat dibandingkan ujungnya.","Pisahkan atribut. Panjang, tinggi, dan berat adalah tiga hal yang berbeda; ketika anak baru belajar satu atribut, jangan mencampurnya dengan atribut lain."],visual:{type:"bars",mode:"compare"},visualCatatan:"Bandingkan dua batang. Perhatikan pentingnya garis awal yang sama.",simbolik:"Gunakan bahasa: “lebih panjang daripada”, “sama tinggi”, “lebih ringan”. Belum perlu lambang.",contoh:{situasi:"Dua pita berbeda panjang.",langkah:["Letakkan dua pita sejajar dengan ujung awal yang sama.","Tanya: “Mana lebih panjang? Bagaimana kamu tahu?”","Geser salah satu pita atau lipat. Tanya: “Apakah panjangnya berubah?”","Ulangi untuk tinggi menara dan berat dua benda."],hasil:"Anak membandingkan atribut yang diminta dan menjelaskan dengan menjajarkan benda."},kesalahan:["Membandingkan dua atribut sekaligus (besar dan berat) saat anak masih belajar satu atribut.","Membiarkan titik awal berbeda sehingga hasil perbandingan menyesatkan."],ringkasan:["Bandingkan satu atribut pada satu waktu.","Samakan titik awal.","Minta bukti: “bagaimana kamu tahu?”"],refleksi:["Atribut mana yang paling mudah dan paling sulit bagi anak?","Apakah saya sudah menjajarkan benda dari titik awal yang sama?"],latihan:[{q:"Dua pita dibandingkan tetapi ujung awalnya tidak sejajar. Masalahnya…",o:["Tidak ada masalah.","Perbandingan dapat menyesatkan karena titik awal berbeda.","Pitanya harus warna sama."],a:1,e:"Titik awal yang sama membuat perbandingan panjang adil."},{q:"Anak belajar membandingkan panjang. Langkah yang tepat berikutnya…",o:["Mengganti dengan berat dan tinggi bersamaan.","Tetap pada panjang dengan benda berbeda, lalu variasikan.","Menghafal kata “lebih panjang”."],a:1,e:"PDF: jangan membandingkan dua atribut sekaligus sementara anak masih belajar satu."}],tujuanKegiatan:"Anak membandingkan panjang, tinggi, dan berat benda dengan menjajarkan atau merasakan.",alat:["Dua pita atau tali berbeda panjang","Balok untuk membuat menara","Dua benda berbeda berat (botol berisi air dan kosong)"],persiapan:"Siapkan pasangan benda dengan perbedaan yang jelas. Tandai garis awal di lantai dengan selotip.",langkah:["Jajarkan pita di garis awal. Tanya mana lebih panjang dan bagaimana tahu.","Bangun dua menara dan bandingkan tingginya.","Pegang dua botol dan bandingkan beratnya.","Gunakan pita yang dilipat agar anak membuktikan dengan meluruskannya."],sederhana:"Hanya bandingkan panjang dengan dua pita yang sangat berbeda sebelum menambah atribut lain.",observasi:"Catat apakah anak menjajarkan dari titik awal dan memakai istilah perbandingan.",jalur:[{k:"C",alasan:"Ini adalah pintu masuk pengukuran."}]},4:{tujuan:"Anak menyusun beberapa benda berurutan menurut suatu atribut dan menempatkan benda baru di posisi yang tepat.",definisi:"Seriation adalah mengurutkan benda menurut atribut (misalnya dari pendek ke panjang). Hubungan “lebih panjang dari yang sebelumnya” menjadi dasar urutan.",mengapa:"Mengurutkan melatih penalaran transitif dan membuka jalan menuju urutan bilangan: tiap bilangan lebih banyak satu daripada sebelumnya.",penjelasan:["Mulailah dengan tiga benda. Ketika tiga stik sudah mudah, tambahkan menjadi lima. Terlalu banyak benda sekaligus akan mengaburkan perbandingan.","Tantangan sebenarnya adalah menyisipkan benda baru. Anak harus membandingkannya dengan tetangga kiri dan kanan. Ini lebih dalam daripada sekadar menyusun dari awal."],visual:{type:"bars",mode:"order"},visualCatatan:"Urutkan batang dari pendek ke tinggi, lalu coba sisipkan batang baru.",simbolik:"Gunakan kata “pertama”, “tengah”, “terakhir”, “sebelum”, “sesudah”.",contoh:{situasi:"Tiga stik es krim berbeda panjang.",langkah:["Minta anak menyusun tiga stik dari pendek ke panjang.","Tambahkan menjadi lima.","Beri satu stik baru: “Taruh di mana?”","Tanya alasan: “Kenapa di situ?”"],hasil:"Anak menempatkan stik baru di posisi tepat dan menjelaskan dengan perbandingan tetangga."},kesalahan:["Memberi terlalu banyak benda sekaligus; mulailah dengan tiga.","Menyusunkan urutan untuk anak sebelum ia mencoba."],ringkasan:["Mulai dari tiga, naik bertahap.","Sisipkan benda baru untuk menguji pemahaman.","Gunakan kata urutan: sebelum, sesudah, tengah."],refleksi:["Apakah anak membandingkan dengan benda tetangga ketika menyisipkan?","Apakah jumlah benda sudah sesuai kemampuannya?"],latihan:[{q:"Jumlah benda yang sebaiknya dipakai pertama kali untuk mengurutkan adalah…",o:["10","3","20"],a:1,e:"PDF menyarankan mulai dari tiga benda agar perbandingan jelas."},{q:"Menyisipkan benda baru ke dalam barisan menunjukkan…",o:["Anak membandingkan dengan benda di kiri dan kanan.","Anak menghafal urutan.","Anak menghitung benda."],a:0,e:"Posisi tepat memerlukan perbandingan dengan tetangga, bukti seriasi yang matang."}],tujuanKegiatan:"Anak menyusun 3–5 stik berurutan dan menyisipkan stik baru.",alat:["5 stik es krim atau sedotan berbeda panjang","Boneka dengan tinggi berbeda","Kertas untuk menandai garis awal"],persiapan:"Potong stik dengan perbedaan yang jelas. Tandai garis awal agar ujungnya sejajar.",langkah:["Susun tiga stik bersama anak dari pendek ke panjang.","Tambahkan dua stik, lalu minta anak menyusun sendiri.","Berikan stik baru dan tanya posisinya.","Tukar dua stik secara sengaja dan ajak anak menemukan yang keliru."],sederhana:"Gunakan hanya tiga stik dengan perbedaan sangat jelas.",observasi:"Catat apakah anak menyisipkan dengan benar dan alasan yang ia berikan.",jalur:[{k:"C",alasan:"Mengurutkan panjang adalah dasar pengukuran."}]},5:{tujuan:"Anak menemukan unit yang berulang pada pola, melanjutkan, memperbaiki, membuat pola baru, dan memindahkannya ke benda lain.",definisi:"Pola adalah susunan dengan unit yang berulang. Pola AB berulang dua unsur (merah–biru–merah–biru); pola AAB, ABB, ABC memiliki unit lebih panjang.",mengapa:"Menemukan keteraturan adalah inti berpikir matematika. Pola juga menjadi dasar bilangan berulang, perkalian, dan aljabar awal.",penjelasan:["Hal terpenting bukan menebak benda berikutnya, melainkan menemukan unitnya: “merah–biru yang terus berulang”. Anak yang dapat menyebut unit mampu melanjutkan pola panjang apa pun.","Pola dapat dipindahkan ke medium lain: dari warna ke suara (tepuk–hentak) atau gerakan. Memindahkan pola menunjukkan anak memahami strukturnya, bukan hanya benda yang dipakai."],visual:{type:"pattern",unit:"AB"},visualCatatan:"Pilih unit, lanjutkan pola, lalu hilangkan satu unsur dan tanyakan penggantinya.",simbolik:"Pola dapat ditulis sebagai AB, AB, AB atau AAB, AAB. Huruf mewakili unsur; belum perlu aljabar.",contoh:{situasi:"Pola balok merah–biru–merah–biru.",langkah:["Susun empat balok bergantian merah–biru dan minta anak melanjutkan.","Tanya: “Apa yang terus berulang?”","Hilangkan satu biru: “Seharusnya di sini apa?”","Pindahkan ke tepuk–hentak dengan tubuh."],hasil:"Anak menyebut unit yang berulang dan memindahkan pola ke gerakan atau suara."},kesalahan:["Hanya meminta menebak benda berikutnya tanpa menemukan unit pola (PDF).","Memakai pola terlalu panjang sebelum AB mantap."],ringkasan:["Temukan unit yang berulang.","Perbaiki pola yang rusak dan buat pola baru.","Pindahkan pola ke medium lain."],refleksi:["Apakah anak menyebut unit pola dengan kata sendiri?","Medium apa yang paling mudah memindahkan pola (suara, gerak, benda)?"],latihan:[{q:"Pola merah–biru–merah–… anak menjawab “biru”. Pertanyaan lanjutan yang paling berguna…",o:["“Apa yang terus berulang di pola ini?”","“Bagus, hitung semua balok.”","“Sekarang buat pola dengan 10 warna.”"],a:0,e:"Menemukan unit adalah inti pola; menebak benda berikutnya belum cukup."},{q:"Memindahkan pola dari warna ke tepuk–hentak membuktikan…",o:["Anak hafal lagu.","Anak memahami struktur pola, bukan hanya bendanya.","Anak menyukai musik."],a:1,e:"Pemindahan antar medium menunjukkan pemahaman struktur berulang."}],tujuanKegiatan:"Anak melanjutkan, memperbaiki, dan membuat pola AB lalu AAB/ABC dengan benda dan gerakan.",alat:["Balok atau manik dua warna","Stiker atau kertas warna","Tubuh (tepuk, hentak, lompat)"],persiapan:"Siapkan 10 benda dua warna. Buat satu pola AB sepanjang enam unsur sebagai contoh.",langkah:["Ajak anak melanjutkan pola AB dan menyebut apa yang berulang.","Hilangkan satu unsur untuk diperbaiki.","Buat pola baru sendiri bergantian.","Pindahkan ke tepuk–hentak dan ke gambar stiker."],sederhana:"Gunakan pola AB dengan benda sangat berbeda (merah dan biru) sebelum AAB.",observasi:"Catat apakah anak menyebut unit, memperbaiki kesalahan, dan memindahkan pola.",jalur:[{k:"E",alasan:"Pola adalah pintu masuk Patterns & Early Algebra."}]}};var Pn={6:{tujuan:"Anak mengucapkan kata bilangan dalam urutan yang tetap pada rentang yang ia kuasai, dengan konteks bermain.",definisi:"Stable order principle: kata bilangan selalu disebut dalam urutan yang sama (satu, dua, tiga, …). Ini adalah “bahasa berhitung”, belum berarti paham jumlah.",mengapa:"Anak membutuhkan urutan kata yang andal sebelum dapat menghitung benda. Namun urutan hanya satu bagian dari berhitung; pemahaman jumlah dibangun di tahap selanjutnya.",penjelasan:["Urutan kata bilangan dilatih lewat aktivitas bertubuh: menghitung tepukan, lompatan, anak tangga. Gerakan membantu anak merasakan satu kata untuk satu langkah.","Hafal “satu sampai dua puluh” belum berarti anak memahami jumlah dua puluh. Jaga rentang sesuai kesiapan dan jangan menjadikannya tes."],visual:{type:"steps",max:10},visualCatatan:"Naiki tangga satu per satu sambil menyebut bilangan. Perhatikan urutan, bukan kecepatan.",simbolik:"Tidak perlu simbol tertulis. Fokus pada ucapan yang konsisten.",contoh:{situasi:"Menaiki tangga rumah atau menghitung lompatan.",langkah:["Hitung langkah naik tangga bersama anak.","Berhenti: “Setelah tiga apa?” biarkan anak melanjutkan.","Ganti dengan tepukan dan lompatan.","Selipkan hitung mundur saat bermain roket, tanpa mewajibkan."],hasil:"Anak konsisten menyebut urutan pada rentang yang dikuasai."},kesalahan:["Menganggap hafal 1–20 sama dengan memahami jumlah 20 (PDF).","Menjadikan lagu atau video berhitung sebagai ukuran pemahaman."],ringkasan:["Urutan kata bilangan tetap.","Latihan lewat gerak dan permainan.","Hafalan urutan belum berarti paham jumlah."],refleksi:["Rentang bilangan mana yang konsisten dikuasai anak?","Apakah saya menyelipkan hitung dalam rutinitas, bukan sebagai tes?"],latihan:[{q:"Anak dapat menyebut 1 sampai 20 dengan lancar. Kesimpulan yang tepat…",o:["Anak sudah paham jumlah 20.","Anak menguasai urutan kata; pemahaman jumlah perlu diamati terpisah.","Anak siap menjumlahkan."],a:1,e:"PDF: hafal urutan belum berarti memahami jumlah."},{q:"Cara latihan urutan yang paling sesuai untuk balita…",o:["Tes cepat berulang.","Menghitung langkah, tepukan, lompatan dalam permainan.","Menulis angka 1–20."],a:1,e:"Gerak dan permainan menyatukan kata dan langkah tanpa tekanan."}],tujuanKegiatan:"Anak menyebut urutan bilangan sambil bergerak: tangga, tepuk, lompat.",alat:["Tangga atau tangga mainan","Jalur lompat dari selotip","Bantal untuk melompat"],persiapan:"Tentukan rentang awal (1–5 atau 1–10). Siapkan jalur di lantai.",langkah:["Hitung lompatan sepanjang jalur bersama.","Berhenti dan minta anak menebak bilangan berikutnya.","Lakukan dengan tepukan dan hentak.","Selipkan hitung mundur bila anak tertarik."],sederhana:"Gunakan rentang 1–5 dengan satu gerakan per kata.",observasi:"Catat rentang konsisten dan apakah ada bilangan yang sering terlewat."},7:{tujuan:"Anak menghitung benda dengan satu kata bilangan untuk satu benda, tanpa melewatkan atau mengulang.",definisi:"One-to-one correspondence adalah menyentuh atau memindahkan satu benda sambil menyebut satu kata bilangan. Setiap benda dihitung tepat satu kali.",mengapa:"Tanpa korespondensi satu-satu, hitungan menjadi tebakan. Tahap ini menjembatani urutan kata dan jumlah benda.",penjelasan:["Memindahkan benda dari kotak A ke kotak B membantu: benda yang sudah dihitung berpindah sehingga tidak dihitung lagi. Sentuhan dan ucapan harus sinkron.","Setelah mantap dengan benda yang tertata, tantang dengan benda berantakan. Anak harus membuat strategi agar tidak ada yang terlewat."],visual:{type:"count",mode:"count",n:5},visualCatatan:"Ketuk benda satu per satu sambil menyebut bilangan. Perhatikan benda yang sudah dihitung.",simbolik:"Belum ada simbol. Fokus pada sinkron sentuhan dan ucapan.",contoh:{situasi:"Lima balok di kotak A.",langkah:["Pindahkan satu balok ke kotak B sambil menyebut “satu”.","Lanjutkan sampai kotak A kosong.","Tanya: “Sudah semua dihitung tepat satu kali?”","Ulangi dengan balok berantakan di lantai."],hasil:"Anak tidak melewatkan dan tidak mengulang; sentuhan sinkron dengan ucapan."},kesalahan:["Membiarkan anak menyebut bilangan lebih cepat daripada gerakan menunjuk (PDF).","Langsung memakai benda berantakan sebelum yang berbaris mantap."],ringkasan:["Satu kata untuk satu benda.","Pindahkan benda agar tidak terhitung dua kali.","Mulai dari benda tertata, lalu berantakan."],refleksi:["Apakah ucapan dan sentuhan anak sinkron?","Strategi apa yang dipakai anak untuk benda berantakan?"],latihan:[{q:"Anak menyebut “satu, dua, tiga” sambil menyentuh dua benda. Masalahnya…",o:["Tidak ada masalah.","Ucapan tidak sinkron dengan sentuhan satu-satu.","Bendanya terlalu sedikit."],a:1,e:"Korespondensi satu-satu membutuhkan satu kata per benda."},{q:"Cara membantu anak tidak menghitung benda dua kali…",o:["Memindahkan benda yang sudah dihitung ke kotak lain.","Meminta lebih cepat.","Menyembunyikan benda."],a:0,e:"Perpindahan menandai benda yang sudah dihitung."}],tujuanKegiatan:"Anak menghitung dengan memindahkan benda satu per satu antar kotak.",alat:["Dua kotak atau mangkuk","5–10 balok atau kancing","Mobil mainan"],persiapan:"Taruh benda di kotak A, kotak B kosong. Duduk di sisi anak.",langkah:["Pindahkan satu per satu sambil menghitung.","Tanya: “Sudah semua?”","Ulangi dengan benda berantakan di lantai.","Gunakan mobil: “Ayo hitung mobilnya.”"],sederhana:"Gunakan 3 benda berbaris sebelum 5 dan benda berantakan.",observasi:"Catat apakah anak melewatkan atau mengulang dan apakah ucapan sinkron."},8:{tujuan:"Anak memahami bahwa bilangan terakhir yang disebut dalam hitungan yang benar menyatakan jumlah seluruh benda.",definisi:"Cardinality adalah prinsip bahwa kata bilangan terakhir = total benda dalam kumpulan itu. “Empat” di akhir bukan nama benda keempat.",mengapa:"Tanpa cardinality, berhitung hanya ritual. Ketika anak paham bahwa “empat” menyatakan semuanya, ia siap membuat kumpulan, membandingkan, dan menambah.",penjelasan:["Pertanda pemahaman: ketika ditanya “berapa semuanya?”, anak menjawab bilangan terakhir tanpa menghitung ulang dari satu.","Perhatikan juga: menghitung benar tidak otomatis berarti paham jumlah. Ajukan pertanyaan setelah selesai menghitung dan perhatikan respons."],visual:{type:"count",mode:"cardinality",n:4},visualCatatan:"Hitung semua benda, lalu jawab “berapa semuanya?”. Amati apakah anak menghitung ulang.",simbolik:"Gunakan ucapan: “ada empat”. Simbol angka bisa dihubungkan nanti (Tahap 13).",contoh:{situasi:"Empat mobil di meja.",langkah:["Hitung bersama: satu, dua, tiga, empat.","Berhenti: “Jadi semuanya ada berapa?”","Geser jarak mobil tanpa menambah, tanya lagi.","Amati apakah anak menjawab langsung atau menghitung ulang."],hasil:"Anak menjawab “empat” sebagai total tanpa mengulang dari satu."},kesalahan:["Menyimpulkan paham hanya dari hitungan yang benar (PDF).","Tidak pernah menanyakan “berapa semuanya?” setelah menghitung."],ringkasan:["Bilangan terakhir menyatakan total.","Tanyakan total setelah menghitung.","Hitungan benar belum tentu paham."],refleksi:["Apakah anak menjawab total tanpa mengulang?","Bagaimana anak bereaksi saat benda digeser?"],latihan:[{q:"Setelah menghitung 4 mobil, anak menghitung lagi dari satu ketika ditanya “berapa semuanya?”. Artinya…",o:["Pemahaman total belum kuat.","Anak sudah mahir.","Mobilnya salah."],a:0,e:"Mengulang hitungan menandakan bilangan terakhir belum dipahami sebagai total."},{q:"Menggeser jarak benda lalu menanyakan total berguna untuk…",o:["Menguji apakah total tetap bila posisi berubah.","Mengajari menjumlahkan.","Menguji kecepatan."],a:0,e:"Ini menghubungkan cardinality dengan konservasi jumlah."}],tujuanKegiatan:"Anak menghitung kumpulan kecil lalu menyatakan totalnya.",alat:["4–6 mobil mainan","Piring kecil","Kartu titik"],persiapan:"Siapkan 3–5 benda yang menarik. Tentukan pertanyaan setelah menghitung.",langkah:["Hitung benda bersama sambil menyentuh.","Tanya: “Jadi semuanya ada berapa?”","Geser jarak benda dan tanya lagi.","Gunakan gambar titik untuk versi gambar."],sederhana:"Gunakan 2–3 benda dan jangan geser dulu.",observasi:"Catat apakah anak menjawab bilangan terakhir atau menghitung ulang."},9:{tujuan:"Anak mengambil tepat sejumlah benda yang diminta dan berhenti ketika jumlah tercapai.",definisi:"Give-N adalah membuat kumpulan dengan jumlah tertentu: “Ambil empat”. Anak harus menghitung sambil mengambil dan berhenti pada jumlah yang diminta.",mengapa:"Kemampuan ini membuktikan pemahaman jumlah, bukan sekadar menyebut. Ini juga dasar menghitung dalam kehidupan nyata: menyiapkan empat sendok.",penjelasan:["Mulailah dari 1–3, lalu 5, dan jika siap hingga 10. Jangan melompat ke rentang besar sebelum anak mantap pada rentang kecil.","Kegiatan harian sangat cocok: “Mama butuh empat sendok”. Anak memiliki alasan nyata untuk berhenti pada empat."],visual:{type:"give"},visualCatatan:"Ambil benda sesuai permintaan, lalu periksa. Coba bilangan berbeda.",simbolik:"Hubungkan kata bilangan dengan jumlah yang anak bentuk. Simbol belum wajib.",contoh:{situasi:"Permintaan mengambil sendok.",langkah:["Katakan: “Ambil tiga balok.”","Setelah anak mengambil, tanya: “Ada berapa? Bagaimana tahu?”","Naikkan ke empat, lalu lima.","Ganti objek: sendok, mainan, jari."],hasil:"Anak memilih jumlah yang diminta dan berhenti tepat."},kesalahan:["Memperluas ke 1–10 sebelum anak stabil di 1–3/1–5 (PDF).","Memberi satu objek saja; variasikan benda."],ringkasan:["Mulai dari kecil: 1–3, lalu 5.","Anak harus berhenti pada jumlah tertentu.","Gunakan kebutuhan nyata sehari-hari."],refleksi:["Jumlah terbesar yang stabil bagi anak?","Situasi rumah apa yang bisa jadi latihan?"],latihan:[{q:"Anak diminta “empat”, tetapi mengambil segenggam tanpa menghitung. Respons yang baik…",o:["“Coba hitung sambil mengambil, berhenti saat empat.”","Memarahi.","Menambah menjadi sepuluh."],a:0,e:"Menghitung sambil mengambil membangun pemahaman jumlah."},{q:"Sebelum meminta 8–10 benda, anak sebaiknya…",o:["Stabil pada 1–3 atau 1–5.","Hafal angka 10.","Bisa menulis angka."],a:0,e:"PDF: jangan memperluas sebelum anak stabil pada rentang kecil."}],tujuanKegiatan:"Anak mengambil dan membuat kumpulan dengan jumlah yang diminta.",alat:["Balok atau kancing besar","Sendok dan piring","Piring kertas"],persiapan:"Siapkan sekotak benda. Tentukan jumlah mulai dari 1–3.",langkah:["Minta anak mengambil sejumlah benda.","Periksa bersama dengan menghitung.","Naikkan jumlahnya sedikit demi sedikit.","Ulangi dengan permainan “toko”."],sederhana:"Gunakan hanya 1, 2, dan 3 sampai anak mantap.",observasi:"Catat jumlah terbesar yang dikuasai dan apakah anak berhenti tepat."},10:{tujuan:"Anak mengenali jumlah kecil sekilas dan mulai melihat kelompok yang membentuk jumlah.",definisi:"Subitizing adalah mengenali jumlah kecil secara langsung tanpa menghitung. Perceptual subitizing untuk 1–3 benda; conceptual subitizing adalah melihat kelompok pembentuk (5 = 2 dan 3).",mengapa:"Anak yang melihat struktur jumlah lebih siap memahami komposisi, tambah, dan nilai tempat. Ini juga mengurangi ketergantungan pada hitung satu-satu.",penjelasan:["Perlihatkan kartu titik sebentar lalu tutup. Tanyakan: “Kamu melihat berapa? Bagaimana kamu tahu?”. Jawaban “dua dan tiga” menunjukkan subitizing konseptual.","Jangan mendesak cepat. Kecepatan bukan tujuan; tujuannya adalah melihat kelompok. Susunan berbeda (4 + 1 atau 2 + 3) membuka berbagai cara melihat."],visual:{type:"dots",n:4},visualCatatan:"Lihat titik sekilas, lalu tebak. Tanyakan bagaimana kamu melihatnya.",simbolik:"Tidak perlu simbol. Cukup “ada lima, karena dua dan tiga”.",contoh:{situasi:"Kartu lima titik.",langkah:["Tunjukkan kartu sekilas lalu tutup.","Tanya: “Berapa yang kamu lihat?”","Tanya cara melihat: “Dua dan tiga? Empat dan satu?”","Ganti susunan titik dan ulangi."],hasil:"Anak menyatakan jumlah dan kelompok pembentuknya tanpa menghitung satu-satu."},kesalahan:["Mendesak cepat; kecepatan bukan tujuan (PDF).","Hanya memakai satu susunan titik."],ringkasan:["Mengenali jumlah kecil sekilas.","Lihat kelompok pembentuk.","Tanyakan cara melihat, bukan hanya jawaban."],refleksi:["Susunan apa yang paling mudah dilihat anak?","Apakah anak mengubah cara melihat saat saya bertanya?"],latihan:[{q:"Anak berkata “lima, karena dua dan tiga”. Ini disebut…",o:["Subitizing konseptual.","Menghafal.","Menebak."],a:0,e:"Melihat kelompok pembentuk adalah subitizing konseptual."},{q:"Sikap yang tepat saat anak lambat menjawab…",o:["Mendesak lebih cepat.","Memberi waktu dan menanyakan cara melihat.","Menghentikan permainan."],a:1,e:"PDF: jangan mendesak cepat."}],tujuanKegiatan:"Anak melihat sekilas kartu titik dan menyebut jumlah beserta kelompoknya.",alat:["Kartu titik 1–5 buatan sendiri","Dadu","Domino"],persiapan:"Buat kartu titik dengan beberapa susunan untuk jumlah yang sama.",langkah:["Tunjukkan satu kartu 2–3 detik lalu tutup.","Tanya jumlah dan cara melihat.","Ulangi dengan susunan berbeda.","Mainkan dengan dadu dan domino."],sederhana:"Hanya jumlah 1–3 dan waktu lihat lebih lama.",observasi:"Catat apakah anak menyebut kelompok atau menghitung satu per satu."},11:{tujuan:"Anak menyadari bahwa jumlah tetap sama ketika benda hanya digeser atau disusun ulang, dan dapat membuktikannya.",definisi:"Conservation of quantity adalah pemahaman bahwa jumlah tidak berubah jika tidak ada yang ditambah atau diambil, walaupun penampilan berubah.",mengapa:"Tanpa konservasi, anak dapat mengira barisan lebih panjang berarti lebih banyak. Ini fondasi perbandingan jumlah dan operasi.",penjelasan:["Anak prasekolah sering terkecoh oleh penampilan. Itu wajar. Jangan memaksa setuju; biarkan anak membuktikan dengan memasangkan atau menghitung.","Gunakan alasan sederhana: “tidak ada yang ditambah atau diambil, masih lima”. Kalimat ini membangun logika, bukan hafalan."],visual:{type:"spread",mode:"conserve",n:5},visualCatatan:"Renggangkan atau rapatkan benda. Hitung lagi untuk membuktikan jumlahnya.",simbolik:"Tidak ada simbol. Fokus pada kalimat alasan.",contoh:{situasi:"Lima kancing.",langkah:["Susun lima kancing rapat dan hitung.","Renggangkan jaraknya.","Tanya: “Masih lima? Kenapa?”","Buktikan dengan menghitung atau memasangkan."],hasil:"Anak menyatakan jumlah tetap dan menyebut alasan tanpa ditambah atau diambil."},kesalahan:["Memaksa anak setuju tanpa bukti (PDF).","Menganggap salah jika anak terkecoh; itu bagian dari perkembangan."],ringkasan:["Posisi berubah, jumlah tetap.","Biarkan anak membuktikan.","Alasan: tidak ditambah atau diambil."],refleksi:["Apakah anak terkecoh oleh barisan panjang?","Bukti apa yang paling meyakinkan baginya?"],latihan:[{q:"Anak mengira barisan yang direnggangkan lebih banyak. Langkah terbaik…",o:["Menjelaskan bahwa ia salah.","Memasangkan satu-satu atau menghitung bersama agar anak melihat buktinya.","Mengganti kegiatan."],a:1,e:"Bukti membangun pemahaman, bukan koreksi sepihak."},{q:"Alasan sederhana untuk konservasi jumlah…",o:["“Tidak ditambah atau diambil, masih sama.”","“Karena Mama bilang begitu.”","“Karena sudah dihitung.”"],a:0,e:"Alasan logis ini yang perlu anak kuasai."}],tujuanKegiatan:"Anak membuktikan jumlah tetap ketika benda digeser atau disusun ulang.",alat:["5 kancing atau balok","Dua kartu putih","Tali untuk susunan melingkar"],persiapan:"Susun benda dalam satu baris rapat. Siapkan kartu untuk menandai posisi.",langkah:["Hitung benda dalam baris rapat.","Renggangkan lalu tanya jumlahnya.","Buktikan dengan menghitung atau memasangkan.","Ganti susunan melingkar."],sederhana:"Gunakan 3 benda dan pembuktian dengan memasangkan.",observasi:"Catat reaksi anak saat benda digeser dan bukti yang ia pilih."},12:{tujuan:"Anak membandingkan dua kumpulan dengan bukti (memasangkan atau menghitung), bukan hanya melihat panjang barisan.",definisi:"Quantity comparison adalah menentukan mana yang lebih banyak, lebih sedikit, atau sama banyak. Pembuktian dilakukan dengan pemasangan satu-satu atau menghitung.",mengapa:"Ini menghubungkan korespondensi dan cardinality, serta jadi dasar selisih dan kurang.",penjelasan:["Anak sering mengira barisan yang lebih panjang berarti lebih banyak. Pasangkan benda satu-satu agar yang berlebih terlihat.","Gunakan bahasa pembanding: “lebih banyak daripada”, “lebih sedikit”, “sama banyak”."],visual:{type:"spread",mode:"compare",n:5},visualCatatan:"Bandingkan dua barisan dengan jarak berbeda. Buktikan dengan memasangkan.",simbolik:"Gunakan kalimat: “lima lebih banyak daripada tiga”. Simbol > dan < ditunda.",contoh:{situasi:"Tiga dan lima mobil.",langkah:["Letakkan dua kumpulan mobil.","Tanya: “Mana lebih banyak? Bagaimana tahu?”","Pasangkan satu-satu dan lihat yang tersisa.",

"Renggangkan salah satu dan tanya lagi."],hasil:"Anak menunjuk yang lebih banyak dengan bukti pemasangan atau hitungan."},kesalahan:["Menyamakan barisan lebih panjang dengan jumlah lebih banyak (PDF).","Memakai jumlah terlalu besar sehingga sulit dibuktikan."],ringkasan:["Bandingkan dengan bukti.","Pasangkan satu-satu atau hitung.","Tampilan bisa menipu."],refleksi:["Apakah anak memilih bukti dengan sendirinya?","Situasi apa yang membuat ia terkecoh?"],latihan:[{q:"Dua barisan sama banyak tetapi jaraknya berbeda. Pertanyaan yang tepat…",o:["“Mana yang lebih panjang?” sebagai jawaban jumlah.","“Bagaimana kita bisa membuktikan mana lebih banyak?”","“Hitung sampai 100.”"],a:1,e:"Pembuktian dengan pasangan atau hitungan menghindari terkecoh."},{q:"Bukti paling sederhana untuk membandingkan jumlah…",o:["Memasangkan satu-satu.","Menebak.","Menunjuk yang berwarna."],a:0,e:"Pemasangan menunjukkan kelebihan dengan jelas."}],tujuanKegiatan:"Anak membandingkan dua kumpulan dan membuktikan jawabannya.",alat:["Dua warna balok","Mobil mainan","Dua piring"],persiapan:"Siapkan dua kumpulan berbeda jumlah (3 dan 5) dan satu pasang sama banyak.",langkah:["Tanya mana lebih banyak.","Pasangkan satu-satu.","Renggangkan lalu ulangi.","Buat dua barisan sama banyak dengan jarak berbeda."],sederhana:"Gunakan perbedaan besar (2 dan 6) lebih dulu.",observasi:"Catat apakah anak memakai bukti atau hanya tampilan."},13:{tujuan:"Anak menghubungkan jumlah benda, kata bilangan, dan lambang tertulis dua arah.",definisi:"Numeral mapping adalah memetakan tiga hal: jumlah (5 benda), kata (“lima”), dan lambang (5). Hubungan harus berjalan dua arah.",mengapa:"Simbol baru bermakna jika terhubung dengan jumlah. Anak yang hanya hafal simbol belum paham.",penjelasan:["Mulai dari jumlah: buat lima balok lalu sebut “lima”, baru kenalkan lambang 5. Urutan ini menjaga simbol tetap bermakna.","Uji dua arah: dari simbol ke jumlah (“ambil sebanyak angka ini”) dan dari jumlah ke simbol (“pilih angka yang cocok”)."],visual:{type:"stepper",mode:"map",n:5},visualCatatan:"Ubah jumlah dan perhatikan kata serta lambangnya.",simbolik:"Kenalkan bentuk dan cara menulis lambang setelah makna jumlah terlihat.",contoh:{situasi:"Lima mobil, kartu titik, dan kartu lambang.",langkah:["Buat lima mobil dan sebut “lima”.","Cocokkan dengan kartu lima titik.","Pilih kartu lambang 5.","Balik: tunjuk lambang 5 dan minta anak membuat jumlahnya."],hasil:"Anak memetakan simbol dan jumlah dua arah pada beberapa benda."},kesalahan:["Hafal simbol tetapi tidak dapat membuat jumlahnya (PDF).","Menuntut menulis angka sebelum anak siap secara motorik."],ringkasan:["Jumlah, kata, lambang.","Mulai dari jumlah.","Uji dua arah."],refleksi:["Simbol mana yang sudah bermakna bagi anak?","Apakah anak mampu membuat jumlah dari simbol?"],latihan:[{q:"Anak mengenali simbol 8 tetapi tidak dapat mengambil 8 benda. Artinya…",o:["Perlu pengalaman konkret lagi.","Anak sudah paham.","Simbol terlalu mudah."],a:0,e:"PDF: hafal simbol tanpa jumlah berarti perlu pengalaman konkret."},{q:"Urutan kenalan yang baik…",o:["Jumlah, kata, lalu simbol.","Simbol dulu.","Menulis dulu."],a:0,e:"Makna jumlah lebih dulu agar simbol bermakna."}],tujuanKegiatan:"Anak memetakan jumlah, kata, dan lambang melalui permainan toko-tokoan.",alat:["Kartu lambang 1–5","Kartu titik","Benda kecil"],persiapan:"Buat kartu lambang dan kartu titik. Siapkan benda untuk dijual.",langkah:["Buat jumlah benda dan sebut kata.","Cocokkan dengan kartu titik lalu lambang.","Mainkan toko: “Aku beli angka 3”.","Balik: tunjuk lambang dan minta anak membuat jumlah."],sederhana:"Hanya 1–3 dengan satu kartu lambang.",observasi:"Catat apakah anak berhasil dua arah dan simbol mana yang sulit."},14:{tujuan:"Anak menghubungkan urutan bilangan dengan perubahan jumlah satu benda: satu lebih banyak dan satu lebih sedikit.",definisi:"One more/one less adalah menambah atau mengurangi satu benda dari kumpulan dan menyebutkan bilangan berikutnya atau sebelumnya.",mengapa:"Tahap ini menghubungkan urutan kata dan jumlah nyata. Ini fondasi tambah dan kurang.",penjelasan:["Mulailah dari benda: empat balok, tambah satu menjadi lima, lalu ambil satu. Perubahan jumlah terlihat dan terasa.","Garis angka berguna sesudah anak paham dengan benda. Jangan hanya mengajar dari garis angka."],visual:{type:"stepper",mode:"onemore",n:4},visualCatatan:"Tambah atau kurangi satu dan perhatikan bilangan yang berubah.",simbolik:"Gunakan bahasa “satu lebih banyak”, “satu lebih sedikit”.",contoh:{situasi:"Empat balok.",langkah:["Hitung empat balok.","Tambah satu dan tanya jumlahnya.","Ambil satu dan tanya lagi.","Gambar titik empat dan lima, sorot yang tambahan."],hasil:"Anak menyebut jumlah baru tanpa menghitung ulang dari satu."},kesalahan:["Hanya memakai garis angka tanpa benda (PDF).","Terburu-buru naik rentang."],ringkasan:["Satu lebih banyak berarti bilangan berikutnya.","Satu lebih sedikit berarti bilangan sebelumnya.","Mulai dari benda."],refleksi:["Apakah anak menyebut jumlah baru tanpa menghitung ulang?","Rentang berapa yang nyaman?"],latihan:[{q:"Empat balok ditambah satu. Anak menjawab “lima” tanpa menghitung ulang. Ini menunjukkan…",o:["Anak menghubungkan urutan dengan perubahan jumlah.","Anak menebak.","Anak lelah."],a:0,e:"Itu bukti hubungan bilangan berikutnya dengan satu benda tambahan."},{q:"Mengapa tidak hanya memakai garis angka?",o:["Anak perlu melihat perubahan jumlah nyata.","Garis angka tidak berguna.","Garis angka terlalu mahal."],a:0,e:"Benda membuat perubahan terlihat; garis angka menyusul."}],tujuanKegiatan:"Anak menambah dan mengambil satu benda lalu menyebut jumlah baru.",alat:["Balok","Papan ular tangga","Kartu titik"],persiapan:"Siapkan 5–6 balok dan wadah.",langkah:["Hitung empat balok.","Tambah satu dan tanya.","Ambil satu dan tanya.","Main ular tangga satu langkah."],sederhana:"Gunakan 1–3 benda.",observasi:"Catat respons anak terhadap tambah dan kurang satu."}};var Nn={15:{tujuan:"Membantu anak melihat 3 dan 4 sebagai “dekat lima”, sehingga ia tidak selalu menghitung dari satu.",definisi:"Anchor of five berarti memakai lima sebagai patokan: lima adalah satu telapak tangan penuh atau satu five-frame penuh. Bilangan di sekitar lima dipahami lewat hubungannya dengan lima, misalnya 4 adalah lima kurang satu dan 3 adalah lima kurang dua.",mengapa:"Patokan ini membuat anak mampu “melihat” jumlah lewat struktur, bukan hanya hitungan satu per satu. Inilah jembatan menuju bilangan di atas lima (6 = 5 dan 1) dan kelak menuju sepuluh.",penjelasan:["Jari tangan adalah alat paling dekat. Lima jari terbuka adalah lima; melipat satu jari memperlihatkan empat tanpa menghitung. Five-frame menunjukkan hal yang sama dalam bentuk tetap: satu baris lima kotak, sebagian terisi, sebagian kosong.","Kuncinya ada pada pertanyaan “berapa yang kosong?”. Anak yang melihat 4 terisi dan 1 kosong sedang memahami bahwa 4 dan 1 membentuk 5. Itu jauh lebih bermakna daripada menghafal “4 + 1 = 5”."],visual:{type:"frame",size:5,init:4},visualCatatan:"Isi 3 atau 4 kotak, lalu tanyakan berapa yang kosong dan bagaimana anak mengetahuinya.",simbolik:"Bila anak siap, 4 boleh dikaitkan dengan 5 − 1 atau 4 + 1 = 5. Menulis simbol tidak wajib; cukup mengucapkan “lima kurang satu”.",contoh:{situasi:"Anak melihat satu telapak tangan dengan satu jari dilipat.",langkah:["Minta anak menunjukkan lima jari, lalu hitung bersama sampai lima.","Lipat satu jari. Tanya: “Berapa jari yang terlihat sekarang?” Biarkan anak menjawab dengan caranya sendiri, termasuk menghitung.","Tanya: “Berapa jari yang bersembunyi? Kalau digabung lagi, jadi berapa?”","Ulangi dengan dua jari terlipat, lalu pindahkan ke five-frame dengan tiga benda terisi."],hasil:"Anak menjelaskan “tiga itu lima kurang dua” atau “tiga terisi, dua kosong” tanpa menghitung dari satu."},kesalahan:["Meminta hafalan semua pasangan lima sebelum anak melihatnya secara visual; biarkan anak menemukannya dari five-frame.","Mengira anak yang cepat menjawab “empat” pasti memahami hubungannya; tanyakan “bagaimana kamu tahu?”."],ringkasan:["Lima adalah patokan: satu tangan atau satu five-frame penuh.","Bilangan dekat lima dilihat dari yang terisi dan yang kosong.","Pertanyaan “berapa yang kosong?” lebih penting daripada jawaban cepat."],refleksi:["Dalam kegiatan tadi, kapan anak berhenti menghitung dari satu dan mulai “melihat” jumlahnya?","Representasi mana (jari, balok, five-frame) yang paling membuat anak yakin?"],latihan:[{q:"Anak melihat five-frame dengan 4 kotak terisi dan menjawab “empat”. Pertanyaan lanjutan yang paling baik adalah…",o:["“Bagus, sekarang hitung sampai 20.”","“Berapa yang kosong, dan bagaimana kamu tahu?”","“Tulis angka 4 sepuluh kali.”"],a:1,e:"Pertanyaan tentang kotak kosong dan alasan membantu anak melihat hubungan 4 dengan 5. Menghitung sampai 20 atau menulis berulang tidak menguji pemahaman struktur."},{q:"Mengapa lima dipakai sebagai patokan sebelum sepuluh?",o:["Karena lima dekat dengan pengalaman anak (jari satu tangan) dan kemampuan melihat kelompok kecil.","Karena sepuluh tidak pernah dipakai di rumah.","Karena anak harus hafal semua pasangan lima lebih dulu."],a:0,e:"Lima dekat dengan pengalaman nyata dan subitizing, sehingga menjadi dasar yang kuat sebelum ten-frame."}],tujuanKegiatan:"Anak melihat 3 dan 4 sebagai hubungan dengan lima memakai jari dan five-frame.",alat:["Jari tangan","Five-frame (kotak telur 5 lubang atau kertas dengan lima kotak)","5 benda besar yang aman (balok, tutup botol besar)","Kartu titik buatan sendiri"],persiapan:"Siapkan satu five-frame dan lima benda besar di meja. Duduk berdampingan agar Anda dan anak melihat arah yang sama. Mulai dengan bermain jari sambil bercerita.",langkah:["Mulai dari jari: “Tunjukkan lima!” Lipat satu jari bersama, lalu tanyakan yang terlihat dan yang bersembunyi.","Pindah ke five-frame: isi 4 kotak dan tanya berapa yang kosong.","Ganti jumlahnya (3, lalu 2) dan minta anak memperkirakan kotak kosong sebelum memeriksa.","Tutup dengan tebak-tebakan: Anda menutup five-frame sebentar, anak menyebut berapa yang terisi."],sederhana:"Gunakan hanya angka 4 dengan jari dan satu benda yang “bersembunyi”; lewati five-frame sampai anak nyaman.",observasi:"Catat apakah anak menyebut yang kosong sebagai bagian dari lima, dan apakah ia masih menghitung dari satu setiap kali.",jalur:[{k:"B",alasan:"Menyebut “terisi” dan “kosong” serta posisi kotak melatih bahasa ruang."}]},16:{tujuan:"Anak menemukan bahwa lima dapat dibentuk dari bagian yang berbeda (1 dan 4, 2 dan 3, dan seterusnya) dan tetap lima, lalu menjelaskannya dengan benda.",definisi:"Composition adalah menggabungkan bagian menjadi satu keseluruhan. Decomposition adalah memecah satu keseluruhan menjadi bagian-bagian. Untuk bilangan 5: 1 dan 4, 2 dan 3, 3 dan 2, 4 dan 1; kelak juga 0 dan 5.",mengapa:"Memahami bahwa satu jumlah bisa “dibongkar-pasang” adalah fondasi semua tambah dan kurang. Anak yang paham 5 dapat dibentuk dari 2 dan 3 tidak perlu menghafal fakta penjumlahan; ia dapat bernalar.",penjelasan:["Mulailah dari benda yang dapat dipindah-pindah. Lima balok dua warna dipisah menjadi dua kelompok, digabung lagi, lalu dipisah dengan cara lain. Pengalaman ini menjawab pertanyaan besar: apakah jumlahnya berubah? Tidak, selama tidak ada yang ditambah atau diambil.","Beri waktu anak menemukan banyak cara sendiri. Menemukan 1 dan 4, lalu 2 dan 3, lalu 4 dan 1 membuat anak melihat pola dan hubungan. Pasangan “kembar” seperti 2 dan 3 dengan 3 dan 2 adalah penemuan penting: urutan bagian boleh ditukar, total tetap."],visual:{type:"bond",total:5,symbols:!1},visualCatatan:"Geser pengatur untuk memecah lima menjadi dua bagian. Nyalakan simbol hanya setelah anak mampu menjelaskan maknanya.",simbolik:"Setelah anak mampu menjelaskan dengan benda, simbol dapat dicatat: 2 + 3 = 5 dan 5 = 2 + 3. Simbol hanyalah catatan dari yang sudah dilihat, bukan tugas hafalan.",contoh:{situasi:"Lima balok dengan dua warna: merah dan biru.",langkah:["Taruh lima balok dalam satu baris. Tanya: “Ada berapa semuanya?”","Pisahkan dua balok merah dan tiga balok biru. Tanya: “Di kiri ada berapa? Di kanan berapa? Kalau digabung lagi?”","Minta anak mencari cara lain, misalnya satu merah dan empat biru. Catat tiap temuan dengan gambar titik dua warna.","Tukar posisi: tiga merah dan dua biru. Tanya: “Totalnya masih lima? Apa yang sama, apa yang berbeda?”"],hasil:"Anak menunjukkan sedikitnya dua pembagian berbeda dan menyatakan bahwa totalnya tetap lima karena tidak ada yang ditambah atau diambil."},kesalahan:["Menganggap 2 + 3 dan 3 + 2 sebagai dua fakta terpisah; biarkan anak menukar posisi dan melihat total tetap.","Menghitung ulang dari satu setiap kali bagian digabung; dorong anak menyebut kedua bagian lalu totalnya.","Memaksa notasi tertulis; anak prasekolah cukup menyebut dan menunjukkan dengan benda."],ringkasan:["Lima dapat dipecah dan digabung dengan banyak cara; totalnya selalu lima.","Bagian boleh ditukar posisinya; total tidak berubah.","Mulai dari benda dua warna; simbol menyusul bila anak siap."],refleksi:["Pembagian lima mana yang paling dulu ditemukan anak, dan mana yang paling sulit baginya?","Bagaimana saya bisa menahan diri tidak memberi jawabannya dan menunggu anak menjelaskan?"],latihan:[{q:"Anak membagi lima balok menjadi 2 merah dan 3 biru, lalu bertanya, “Kalau digabung lagi jadi berapa?” Respons terbaik adalah…",o:["“Lima. Hafalkan 2 + 3 = 5 dan tulis sepuluh kali.”","“Coba gabungkan dan hitung bersama. Apa yang kamu temukan?”","“Itu sudah pasti, tidak usah ditanya.”"],a:1,e:"Menggabungkan dan memeriksa sendiri memberi anak bukti bahwa total tetap. Menyuruh menulis berulang atau menutup pertanyaan melewatkan kesempatan bernalar."},{q:"Tanda anak mulai memahami komposisi lima adalah…",o:["Menghafal “2 + 3 = 5” sebagai kalimat tetap.","Menunjukkan lebih dari satu pembagian dan menyatakan totalnya tetap lima.","Menunjuk jawaban paling cepat dari kartu."],a:1,e:"Indikator dari PDF: menunjukkan lebih dari satu pembagian dengan total tetap. Kecepatan dan hafalan belum menunjukkan pemahaman."},{q:"Mengapa “bagian nol” (0 dan 5) diperkenalkan belakangan?",o:["Karena nol bukan bilangan.","Karena “tidak ada” sebagai sebuah bagian membutuhkan bahasa dan pengalaman yang lebih matang.","Karena tidak pernah diperlukan."],a:1,e:"PDF menyarankan bagian nol dengan bahasa “tidak ada” ketika anak sudah memahami; gagasannya lebih halus daripada 1 dan 4 atau 2 dan 3."}],tujuanKegiatan:"Anak memecah dan menggabungkan lima benda dua warna, menemukan beberapa cara, dan menjelaskan bahwa totalnya tetap.",alat:["5 balok atau tutup botol besar merah dan 5 biru (pakai ukuran yang aman)","Dua lingkaran dari kertas atau tali","Kertas dan spidol untuk menggambar titik dua warna","Five-frame (opsional)"],persiapan:"Siapkan balok dua warna, dua lingkaran, dan kertas gambar. Mulailah dengan cerita pendek: “Ada lima teman yang harus duduk di dua meja.”",langkah:["Taruh lima balok. Minta anak menghitung lalu mengatakan, “Semuanya ada berapa?”","Minta anak membagi balok ke dua lingkaran sesukanya. Tanya: “Di sini ada berapa, di sana berapa?”","Gabungkan lagi, lalu tantang: “Bisa dibagi dengan cara lain?” Ulangi untuk menemukan 1 dan 4, 2 dan 3, 3 dan 2, 4 dan 1.","Gambar setiap temuan sebagai titik dua warna agar anak punya “album cara”."],sederhana:"Mulai dengan empat balok dan hanya dua cara (1 dan 3, 2 dan 2). Naik ke lima setelah anak yakin.",observasi:"Catat berapa cara berbeda yang ditemukan anak sendiri, apakah ia menjelaskan mengapa totalnya tetap, dan apakah ia menggabungkan tanpa menghitung dari satu.",jalur:[{k:"E",alasan:"Menyadari bahwa “satu bagian bertambah, bagian lain berkurang” adalah langkah awal berpikir aljabar."}]},17:{tujuan:"Anak membedakan keseluruhan dari bagian-bagiannya dan memahami bahwa keseluruhan tidak berubah saat bagian dipisah atau digabung.",definisi:"Part–whole adalah hubungan antara satu keseluruhan (total) dan bagian-bagian yang membentuknya. Bagian berada di dalam keseluruhan; bukan kelompok baru di luar keseluruhan.",mengapa:"Seluruh operasi bilangan bertumpu pada hubungan ini: tambah mencari total, kurang mencari bagian. Anak yang kuat di part–whole akan lebih mudah memahami number bond, cerita matematika, dan bar model.",penjelasan:["Kekeliruan yang umum adalah menganggap total sebagai “kelompok ketiga”. Padahal, lima mobil yang terdiri dari dua merah dan tiga biru tetap lima mobil; dua dan tiga hanyalah cara memilahnya.","Bahasa membantu: sebut “keseluruhan” dan “bagian”, tunjuk dengan tangan yang melingkupi semua benda, lalu tunjuk tiap bagian. Aturan pengelompokan boleh berganti (warna, lalu fungsi) sementara totalnya tetap."],visual:{type:"bond",total:5,symbols:!1},visualCatatan:"Perhatikan lingkaran atas (keseluruhan) yang tetap saat dua bagian di bawahnya berubah.",simbolik:"Gunakan kata “keseluruhan 5, bagian 2 dan 3”. Simbol seperti 2 + 3 = 5 menyusul, setelah anak mampu menunjuk bagian dan keseluruhan pada benda.",contoh:{situasi:"Lima mobil: dua merah dan tiga biru.",langkah:["Taruh lima mobil. Lingkari semuanya dengan tali: “Ini keseluruhannya.”","Pisahkan menurut warna. Tanya: “Mana bagiannya? Ada berapa tiap bagian?”","Gabungkan lagi di dalam tali. Tanya: “Sekarang semuanya berapa?”","Kelompokkan ulang menurut fungsi (yang punya atap dan yang tidak). Tanya: “Keseluruhannya berubah?”"],hasil:"Anak menyatakan keseluruhan tetap lima walaupun bagian-bagiannya berbeda menurut aturan pengelompokan."},kesalahan:["Menggambar keseluruhan seolah menjadi kelompok ketiga yang terpisah dari kedua bagiannya.","Hanya memakai satu cara memilah (warna); variasikan aturan agar anak paham total tetap."],ringkasan:["Keseluruhan terdiri dari bagian-bagian; bagian ada di dalam keseluruhan.","Memisah dan menggabung tidak mengubah total.","Aturan memilah boleh berganti; totalnya tetap."],refleksi:["Apakah anak menunjuk keseluruhan dengan gerakan yang melingkupi semua benda?","Aturan memilah apa lagi yang bisa kita pakai besok?"],latihan:[{q:"Lima mobil dipisah menjadi 2 merah dan 3 biru. Berapa keseluruhan mobil sekarang?",o:["Lima, karena hanya cara memilahnya yang berubah.","Sepuluh, karena ada dua kelompok.","Dua, karena merah dulu."],a:0,e:"Keseluruhan tidak berubah ketika benda hanya dipisah menurut aturan tertentu."},{q:"Gambar yang kurang tepat untuk part–whole adalah…",o:["Kotak besar berisi dua kotak kecil sebagai bagian.","Dua kelompok bagian ditambah satu kelompok “total” terpisah yang ikut dihitung.","Tali yang melingkari seluruh benda lalu dibagi dua."],a:1,e:"Total bukan kelompok tambahan; ia adalah gabungan bagian-bagian itu sendiri."}],tujuanKegiatan:"Anak menunjuk keseluruhan dan bagian pada benda nyata, lalu memilah dengan aturan berbeda.",alat:["5–6 mobil mainan (atau benda lain yang aman)","Tali atau lingkaran kertas besar","Dua piring kecil"],persiapan:"Taruh benda dalam satu tumpukan. Siapkan tali yang cukup panjang untuk melingkarinya dan dua piring sebagai “rumah bagian”.",langkah:["Lingkari semua benda dengan tali: “Ini keseluruhannya.” Hitung bersama.","Pindahkan ke dua piring menurut warna. Tanya bagian mana dan berapa.","Satukan lagi dalam tali dan tanya total sekarang.","Ganti aturan memilah (besar–kecil, bisa berjalan–tidak) dan ulangi."],sederhana:"Gunakan 3 atau 4 benda dan satu aturan (warna) sampai anak lancar membedakan bagian dan keseluruhan.",observasi:"Catat apakah anak menyebut total yang sama setelah memilah ulang, dan bagaimana ia menunjuk keseluruhan."},18:{tujuan:"Anak memakai susunan lima dan sepuluh (ten-frame) untuk mengenali jumlah tanpa selalu menghitung semuanya.",definisi:"Ten-frame adalah bingkai dua baris dengan lima kotak per baris. Baris atas penuh berarti lima, dua baris penuh berarti sepuluh. Jumlah dibaca sebagai “lima ditambah sisanya” atau “sepuluh kurang beberapa”.",mengapa:"Ten-frame memperlihatkan struktur lima dan sepuluh secara visual. Alat ini menjadi dasar komposisi hingga 10, strategi make ten, dan kelak nilai tempat.",penjelasan:["Ten-frame adalah alat, bukan tujuan. Nilainya terletak pada gambar yang terbentuk di kepala anak: delapan adalah satu baris penuh ditambah tiga, atau sepuluh kurang dua.","Pertanyaan yang paling berguna adalah yang sama dari tahap sebelumnya: “Berapa yang terisi? Berapa yang kosong? Bagaimana kamu tahu?” Biarkan anak memakai caranya sendiri, lalu perkenalkan cara melihat lain."],visual:{type:"frame",size:10,init:6},visualCatatan:"Isi baris atas lebih dulu, lalu tambahkan. Tanyakan berapa yang kosong untuk mencapai sepuluh.",simbolik:"Bila anak sudah paham, 8 dapat dituliskan sebagai 5 + 3 dan 10 − 8 = 2. Jangan langsung melatih rumus make ten; itu tahap 30.",contoh:{situasi:"Ten-frame dengan 6 benda.",langkah:["Isi baris atas sampai penuh (lima), lalu tambah satu di baris bawah. Tanya: “Berapa semuanya?”","Tanya: “Berapa yang masih kosong? Butuh berapa lagi sampai sepuluh?”","Ganti menjadi 7 dan 8, dan tanyakan pola yang tampak (lima ditambah sisanya).","Gambar dua baris kotak di kertas dan minta anak mewarnai 8; tanyakan berapa yang tidak berwarna."],hasil:"Anak menyebut “enam itu lima dan satu” atau “empat lagi sampai sepuluh” tanpa menghitung dari awal."},kesalahan:["Menjadikan ten-frame sebagai latihan rumus (make ten) sebelum pasangan sepuluh bermakna.","Mengisi kotak secara acak; isi dari baris atas, kiri ke kanan, agar strukturnya terlihat."],ringkasan:["Ten-frame memperlihatkan jumlah relatif terhadap lima dan sepuluh.","Baca jumlah sebagai “lima dan sisanya” atau “sepuluh kurang”.","Ini alat bantu, bukan target yang dikejar."],refleksi:["Apakah anak sudah menyebut “lima dan …” tanpa diminta?","Apakah saya mengisi kotak dengan urutan konsisten agar polanya terlihat?"],latihan:[{q:"Ten-frame berisi 8 benda. Cara melihat yang paling membantu pemahaman struktur adalah…",o:["Menghitung dari satu setiap kali.","Satu baris penuh (lima) dan tiga lagi, atau sepuluh kurang dua.","Menghafal gambar delapan."],a:1,e:"Struktur lima dan sepuluh memungkinkan anak melihat jumlah tanpa menghitung semuanya."},{q:"Kapan make ten sebaiknya diperkenalkan?",o:["Segera setelah anak mengenal ten-frame.","Setelah pasangan sepuluh dan komposisi hingga 10 bermakna bagi anak.","Di usia 3 tahun, sebagai target."],a:1,e:"PDF menegaskan make ten tidak boleh dipercepat; anak perlu paham 8 butuh 2 untuk menjadi 10, dan 5 dapat dipecah."}],tujuanKegiatan:"Anak mengisi dan membaca ten-frame, menyebut yang terisi dan kosong, dan melihat pola lima ditambah sisanya.",alat:["Ten-frame buatan sendiri (kertas dua baris lima kotak) atau wadah telur 10 lubang","10 benda besar (balok atau tutup botol besar)","Pensil warna"],persiapan:"Gambar ten-frame di kertas dengan kotak yang cukup besar untuk benda. Letakkan benda di mangkuk di samping.",langkah:["Isi baris atas penuh bersama anak. Tanya, “Ini berapa?”","Tambah satu per satu di baris bawah sambil menyebut “lima dan satu, lima dan dua…”.","Tutup ten-frame dengan kertas; anak menebak berapa yang kosong sebelum membuka.","Gambar satu jumlah dan minta anak mewarnai kotak yang terisi."],sederhana:"Pakai five-frame dulu, lalu tambahkan baris kedua setelah anak nyaman dengan lima.",observasi:"Catat apakah anak memakai “lima dan …”, dan apakah ia menghitung semua kotak setiap kali.",jalur:[{k:"B",alasan:"Atas–bawah dan baris–kolom pada ten-frame melatih penalaran ruang."}]},19:{tujuan:"Anak menemukan beberapa pasangan bagian yang membentuk total sampai 10 dan menjelaskan bahwa totalnya tetap.",definisi:"Komposisi dan dekomposisi hingga 10 memperluas gagasan dari lima: 7 dapat dibentuk dari 5 dan 2, 4 dan 3, atau 6 dan 1; 10 dapat dibentuk dari 9 dan 1, 8 dan 2, dan seterusnya.",mengapa:"Fleksibilitas memecah bilangan hingga 10 adalah bahan baku strategi hitung selanjutnya (misalnya make ten) dan membuat anak tidak bergantung pada hafalan.",penjelasan:["Prinsipnya sama dengan komposisi lima, tetapi sekarang ada lebih banyak kemungkinan. Berikan waktu: anak menemukan satu cara, lalu cara lain, lalu menyadari pola, misalnya satu bertambah dan satu berkurang.","Ten-frame membantu melihat pasangan. Tujuh tersusun lima di baris atas dan dua di bawah; atau empat dan tiga bila dipisah dengan warna. Tidak ada keharusan menghafal seluruh pasangan sepuluh sebagai syarat maju."],visual:{type:"bond",total:7,adjustTotal:!0,min:3,max:10,symbols:!1},visualCatatan:"Ubah total dan geser pembagiannya. Ajak anak menemukan pola: yang satu bertambah, yang lain berkurang.",simbolik:"Gunakan 7 = 5 + 2 ketika representasi nyata sudah masuk akal. Catat banyak kombinasi dalam satu daftar, bukan satu jawaban “benar”.",contoh:{situasi:"Tujuh balok dua warna.",langkah:["Buat tujuh balok: lima merah dan dua biru. Tanya: “Ada berapa semuanya?”","Minta anak memindahkan satu merah menjadi biru. Tanya: “Totalnya berubah? Sekarang bagian-bagiannya berapa?”","Lanjutkan sampai anak menemukan 6 dan 1, 5 dan 2, 4 dan 3.","Catat tiap temuan dengan gambar kotak atau titik."],hasil:"Anak menunjukkan beberapa kombinasi berbeda dari total yang sama dan memperhatikan pola “satu pindah”."},kesalahan:["Menuntut hafalan semua pasangan 10 sebelum anak maju.","Memberi satu “jawaban benar”, padahal tujuan tahap ini adalah beragam kombinasi."],ringkasan:["Total yang sama bisa dibentuk dari berbagai pasangan bagian.","Memindah satu benda antar bagian tidak mengubah total.","Pencatatan kombinasi mendukung pola, bukan hafalan."],refleksi:["Berapa kombinasi berbeda yang ditemukan anak sendiri hari ini?","Apakah anak melihat pola “satu pindah” tanpa saya sebutkan?"],latihan:[{q:"Anak memindahkan satu balok merah menjadi biru pada tujuh balok. Yang tepat adalah…",o:["Total menjadi enam.","Total tetap tujuh; hanya pembagian bagiannya yang berubah.","Total menjadi delapan."],a:1,e:"Memindah benda antar bagian tidak menambah atau mengurangi total."},{q:"Mana yang paling mendukung pemahaman komposisi hingga 10?",o:["Menghafal daftar pasangan sepuluh lewat lagu.","Menemukan banyak kombinasi dengan benda dua warna dan menjelaskan polanya.","Menulis 7 = 5 + 2 di lembar kerja berulang."],a:1,e:"Eksplorasi dengan benda dan penjelasan menghasilkan pemahaman; hafalan dan lembar kerja saja belum."}],tujuanKegiatan:"Anak menemukan beberapa pasangan bagian untuk 6–10 benda, lalu menjelaskan bahwa totalnya tetap.",alat:["10 balok atau tutup botol besar dua warna","Ten-frame","Kertas dan pensil warna untuk mencatat"],persiapan:"Pilih total yang akan dieksplorasi (mulai 6 atau 7). Siapkan balok dua warna dan ten-frame di meja.",langkah:["Susun total yang dipilih dalam ten-frame dengan dua warna.","Pindahkan satu balok dari satu warna ke warna lain. Tanya: “Apa yang berubah? Apa yang tetap?”","Catat setiap kombinasi dengan gambar kotak dua warna.","Tantang: “Adakah kombinasi yang belum kita temukan?”"],sederhana:"Tetap di total 6 dengan tiga atau empat kombinasi sebelum naik ke 7 atau 8.",observasi:"Catat jumlah kombinasi yang ditemukan sendiri dan penjelasan anak tentang total yang tetap."},20:{tujuan:"Anak menemukan bagian yang belum diketahui dari keseluruhan dan satu bagian yang terlihat.",definisi:"Missing part adalah situasi ketika total diketahui dan satu bagian diketahui, sedangkan bagian lain dicari. Number story adalah cerita pendek yang menyampaikan situasi itu.",mengapa:"Mencari bagian yang hilang adalah bentuk paling awal dari pengurangan dan persamaan dengan bilangan yang belum diketahui. Anak belajar bernalar, bukan sekadar menghitung.",penjelasan:["Mulai dengan permainan menutup: lima benda, sebagian ditutup kain. Anak melihat bagian yang terlihat dan menebak yang bersembunyi. Pemeriksaan dengan membuka penutup memberi umpan balik yang jelas.","Cerita lebih penting daripada persamaan. Ceritakan “semula ada lima, dua terlihat”, biarkan anak membayangkan, dan hindari langsung menuliskan 2 + ? = 5 sebelum anak paham situasinya."],visual:{type:"hidden",total:5},visualCatatan:"Tebak bagian yang tertutup, lalu buka penutup untuk memeriksa. Coba beberapa total.",simbolik:"Jika siap, representasikan sebagai 2 + ? = 5 atau 5 − 2 = ?. Pastikan anak lebih dulu menjelaskan ceritanya dengan benda.",contoh:{situasi:"Lima mobil; dua terlihat, tiga ditutup kain.",langkah:["Tunjukkan lima mobil bersama anak dan hitung. Tutup sebagian dengan kain tanpa memperlihatkan jumlahnya.","Katakan: “Semula ada lima. Dua terlihat. Berapa yang bersembunyi?”","Minta anak menebak. Tanya bagaimana ia berpikir (menghitung lanjut, membayangkan).","Buka kain bersama-sama dan periksa: dua dan tiga bersama membentuk lima."],hasil:"Anak menjelaskan bahwa bagian terlihat dan bagian tersembunyi bersama membentuk total lima."},kesalahan:["Langsung memakai persamaan tertulis sebelum anak memahami ceritanya.","Menilai dari satu tebakan benar; ulangi dengan total dan bagian berbeda."],ringkasan:["Total + satu bagian diketahui → cari bagian lain.","Mulai dari permainan menutup dan cerita.","Pemeriksaan dengan membuka penutup memberi bukti."],refleksi:["Strategi apa yang dipakai anak untuk menebak (menghitung lanjut, membayangkan, mengingat pasangan)?","Bagaimana cerita dapat saya variasikan (datang, pergi, bersembunyi)?"],latihan:[{q:"Lima mobil, dua terlihat. Yang sedang dicari anak adalah…",o:["Jumlah total.","Bagian yang tersembunyi.","Jumlah warna mobil."],a:1,e:"Total (lima) dan satu bagian (dua) diketahui; yang dicari adalah bagian lainnya."},{q:"Urutan yang disarankan untuk tahap ini adalah…",o:["Persamaan tertulis lebih dulu, baru cerita.","Cerita dan benda lebih dulu, simbol bila anak siap.","Hanya lembar kerja bilangan."],a:1,e:"PDF: jangan langsung bertanya dengan format persamaan jika anak belum memahami cerita."}],tujuanKegiatan:"Anak menebak jumlah benda yang tersembunyi dan memeriksanya dengan membuka penutup.",alat:["5–6 benda kecil yang aman (mobil mainan)","Kain atau cangkir untuk menutup","Kertas untuk mencatat cerita"],persiapan:"Tentukan total (mulai 4 atau 5). Siapkan kain dan benda; lakukan di meja yang datar.",langkah:["Tunjukkan semua benda dan hitung bersama.","Tutup sebagian tanpa memperlihatkan jumlahnya dan sebutkan bagian yang terlihat.","Anak menebak yang tersembunyi dan menjelaskan caranya.","Buka penutup bersama-sama, lalu ganti peran: anak menyembunyikan, Anda menebak."],sederhana:"Gunakan total 3 atau 4 dengan satu benda yang bersembunyi.",observasi:"Catat apakah anak memakai strategi tertentu (menghitung lanjut, mengingat pasangan) dan bagaimana ia menjelaskan.",jalur:[{k:"E",alasan:"Bilangan yang belum diketahui adalah bentuk paling awal dari berpikir aljabar."}]}};var Mn={21:{tujuan:"Anak memahami number bond sebagai gambar part–whole dan dapat menjelaskan arti tiap lingkaran, bukan sekadar mengisinya.",definisi:"Number bond adalah diagram: satu lingkaran di atas untuk keseluruhan (whole) dan dua lingkaran di bawah untuk bagian (parts), dihubungkan garis. Diagram ini adalah cara mencatat hubungan part–whole yang sudah dikenal dari benda.",mengapa:"Diagram yang sama dapat dipakai untuk tambah, kurang, dan kelak bar model. Anak yang paham arti tiap lingkaran dapat memakainya untuk berpikir, bukan untuk mengisi kotak.",penjelasan:["Number bond bukan konsep baru; ia adalah gambar untuk hubungan yang sudah ditemukan dengan balok. Karena itu mulailah dari benda: lima balok dipecah menjadi dua dan tiga, lalu gambarkan sebagai tiga lingkaran.","Ujilah pemahaman dengan pertanyaan arti: “Apa arti angka di lingkaran atas? Dua lingkaran bawah ini apa?”. Anak yang hanya menyalin angka akan kesulitan menjawabnya."],visual:{type:"bond",total:5,symbols:!0,adjustTotal:!0,min:3,max:10},visualCatatan:"Ubah pembagian dan perhatikan lingkaran atas yang tetap. Tukar posisi bagian untuk melihat total tetap.",simbolik:"Setelah anak paham, diagram dapat dibaca sebagai 2 + 3 = 5 dan 5 − 2 = 3. Simbol adalah bahasa untuk gambar yang sudah dimengerti.",contoh:{situasi:"Lima balok dipecah menjadi dua dan tiga.",langkah:["Pecah lima balok menjadi dua kelompok di dua piring.","Gambar lingkaran besar untuk lima (keseluruhan) dan dua lingkaran kecil untuk bagian.","Tanya: “Lingkaran atas mewakili apa? Dua yang bawah?”","Tukar posisi bagian dan tanya apakah total berubah."],hasil:"Anak menjelaskan fungsi tiap lingkaran dengan merujuk benda."},kesalahan:["Hanya memberi lembar kerja mengisi lingkaran kosong tanpa benda (PDF).","Mengajarkan diagram sebelum hubungan part–whole dipahami dengan benda."],ringkasan:["Number bond adalah gambar part–whole, bukan topik baru.","Mulai dari benda, baru lingkaran.","Nilai pemahaman dari penjelasan anak."],refleksi:["Dapatkah anak menjelaskan arti lingkaran atas dan bawah dengan kata sendiri?","Apakah anak masih membutuhkan benda untuk mengisi diagram?"],latihan:[{q:"Anak mengisi banyak number bond dengan benar di lembar kerja tetapi tidak dapat menjelaskan artinya. Yang dibutuhkan…",o:["Lebih banyak lembar kerja.","Kembali ke benda dan minta anak menunjuk bagian serta keseluruhan.","Menaikkan angka."],a:1,e:"PDF menekankan pemahaman arti, bukan sekadar mengisi lingkaran."},{q:"Menukar posisi bagian 2 dan 3 pada number bond 5 memperlihatkan…",o:["Total tetap sama.","Total berubah.","Kesalahan penulisan."],a:0,e:"Urutan bagian tidak mengubah keseluruhan."}],tujuanKegiatan:"Anak menggambar number bond dari benda yang ia pecah dan menjelaskan artinya.",alat:["5–7 balok","Kertas dan pensil","Tutup botol untuk lingkaran"],persiapan:"Siapkan kertas besar dengan satu lingkaran di atas dan dua di bawah.",langkah:["Pecah balok menjadi dua bagian.","Taruh balok di lingkaran sesuai bagian.","Tuliskan jumlahnya dan tanya arti tiap lingkaran.","Tukar posisi bagian dan ulangi."],sederhana:"Gunakan total 4 dan dua pembagian saja.",observasi:"Catat apakah anak menjelaskan arti lingkaran dan menukar posisi bagian dengan yakin.",jalur:[{k:"E",alasan:"Diagram part–whole adalah langkah menuju representasi aljabar."}]},22:{tujuan:"Anak memahami penjumlahan sebagai menggabungkan dua kumpulan menjadi satu total, bukan sekadar menghitung.",definisi:"Addition as joining adalah situasi dua kumpulan disatukan dan jumlah seluruhnya dicari. Persamaan 3 + 2 = 5 adalah catatan dari kejadian itu.",mengapa:"Makna kejadian membuat penjumlahan bernalar. Anak yang paham cerita dapat menyelesaikan soal baru tanpa menghafal.",penjelasan:["Mulai dari cerita nyata: tiga mobil di garasi, dua mobil datang. Biarkan anak menyatukan benda dan menghitung semua.","Variasikan konteks (apel di keranjang, orang ke bus, balok ke menara) agar anak tidak mengira semua cerita “datang” sama dengan tambah. Perhatikan bahwa konteks harus dipahami dahulu."],visual:{type:"ops",mode:"join",a:3,b:2},visualCatatan:"Satukan dua kumpulan, lalu lihat total. Ubah jumlah di tiap kumpulan.",simbolik:"Setelah anak memahami kejadiannya, tuliskan 3 + 2 = 5 sebagai catatan.",contoh:{situasi:"Tiga mobil di garasi, dua mobil datang.",langkah:["Taruh tiga mobil di garasi.","Tambahkan dua mobil dan satukan.","Tanya: “Sekarang semuanya berapa? Tunjukkan.”","Catat sebagai 3 + 2 = 5 jika siap."],hasil:"Anak menjelaskan bahwa dua kumpulan menjadi satu total."},kesalahan:["Memulai dari simbol (PDF).","Menganggap semua cerita “datang” pasti tambah tanpa memahami konteks."],ringkasan:["Penjumlahan adalah penggabungan.","Mulai dari cerita dan benda.","Variasikan konteks."],refleksi:["Cerita apa yang paling mudah dipahami anak?","Apakah anak menunjuk dua kumpulan dan totalnya?"],latihan:[{q:"Urutan yang tepat untuk mengenalkan 3 + 2 = 5…",o:["Simbol dulu, lalu cerita.","Cerita dan benda dulu, lalu simbol.","Hafalan lalu benda."],a:1,e:"PDF: jangan memulai dari simbol."},{q:"Variasi cerita penjumlahan berguna karena…",o:["Agar anak memahami makna penggabungan di banyak konteks.","Agar soal terlihat sulit.","Agar menghafal lebih cepat."],a:0,e:"Variasi konteks memperluas pemahaman."}],tujuanKegiatan:"Anak memerankan cerita penggabungan dengan mobil, apel, atau balok.",alat:["Mobil mainan dan garasi dari kardus","Keranjang dan apel mainan","Balok"],persiapan:"Siapkan 6–8 mainan dan satu kardus sebagai garasi.",langkah:["Ceritakan: “Ada tiga mobil di garasi.”","Tambahkan dua mobil dan satukan.","Hitung dan tanya jumlahnya.","Ganti cerita dengan apel di keranjang."],sederhana:"Gunakan jumlah 1–3 saja dan cerita sangat sederhana.",observasi:"Catat apakah anak menjelaskan penggabungan dan cara ia mencari total."},23:{tujuan:"Anak memahami pengurangan sebagai mengambil sebagian sehingga tersisa bagian lain, dan menjelaskan awal, diambil, sisa.",definisi:"Subtraction as separating adalah situasi sebagian kumpulan diambil dan jumlah yang tersisa dicari. Persamaan 6 − 2 = 4 mencatat peristiwa itu.",mengapa:"Pengurangan bukan hanya “angka mengecil”. Cerita membantu anak melihat jumlah awal, yang diambil, dan sisanya, serta hubungan dengan part–whole.",penjelasan:["Gunakan benda yang benar-benar diambil: enam balok, ambil dua, hitung sisanya. Gambar dengan mencoret dua dari enam.","Cerita dengan bagian tersembunyi (enam balok, dua di bawah kain) menghubungkan pengurangan dengan part–whole dan Tahap 20."],visual:{type:"ops",mode:"separate",a:6,b:2},visualCatatan:"Ambil sebagian benda dan lihat sisanya. Ubah jumlah awal dan yang diambil.",simbolik:"Setelah siap, hubungkan ke 6 − 2 = 4. Tanda minus mencatat “diambil”.",contoh:{situasi:"Enam balok, dua diambil.",langkah:["Taruh enam balok.","Ambil dua dan jauhkan.","Tanya: “Tersisa berapa? Bagaimana tahu?”","Catat 6 − 2 = 4 bila siap."],hasil:"Anak menyebut jumlah awal, jumlah yang diambil, dan sisanya."},kesalahan:["Membatasi pengurangan pada “angka menjadi lebih kecil” tanpa cerita (PDF).","Langsung memakai persamaan tanpa benda."],ringkasan:["Pengurangan: awal, diambil, sisa.","Cerita dan benda dahulu.","Hubungkan dengan bagian tersembunyi."],refleksi:["Bisakah anak menyebut ketiga bagian cerita?","Cerita mana yang paling bermakna baginya?"],latihan:[{q:"Enam balok, dua diambil. Yang perlu anak sebut…",o:["Awal enam, diambil dua, sisa empat.","Hanya “empat”.","Hanya “enam”."],a:0,e:"Menyebut ketiga bagian menunjukkan pemahaman cerita."},{q:"Mengapa pengurangan tidak hanya “angka mengecil”?",o:["Karena maknanya adalah mengambil sebagian dan mencari sisa.","Karena angka tidak penting.","Karena selalu lebih mudah."],a:0,e:"Makna cerita membuat pengurangan bermakna."}],tujuanKegiatan:"Anak mengambil benda dari kumpulan dan menjelaskan sisa dengan cerita.",alat:["6–8 balok","Kain penutup","Kertas untuk mencoret gambar"],persiapan:"Siapkan kumpulan balok dan satu kain.",langkah:["Hitung enam balok bersama.","Ambil dua dan tanya sisa.","Gambar enam titik dan coret dua.","Ganti cerita: kue dimakan atau teman pulang."],sederhana:"Gunakan 3–4 benda dan ambil satu atau dua.",observasi:"Catat apakah anak menyebut awal, diambil, dan sisa dengan kata sendiri."},24:{tujuan:"Anak menjelaskan hubungan tambah dan kurang lewat satu model benda yang sama.",definisi:"Hubungan tambah–kurang berarti satu keseluruhan dan dua bagian dapat menghasilkan beberapa kalimat: 3 + 2 = 5, 2 + 3 = 5, 5 − 2 = 3, 5 − 3 = 2. Kumpulan kalimat itu sering disebut fact family.",mengapa:"Anak yang melihat keluarga fakta berasal dari satu gambar tidak perlu menghafal empat fakta terpisah. Pengurangan dapat diselesaikan dengan berpikir tambah.",penjelasan:["Mulai dari tiga balok merah dan dua biru. Gabungkan menjadi lima, lalu ambil dua biru: tersisa tiga merah. Satu model, dua cerita.","Fact family bermakna ketika anak dapat menunjuk benda yang menjadi bagian dan keseluruhan pada setiap kalimat. Hafalan tanpa kumpulan konkret tidak cukup."],visual:{type:"bond",total:5,symbols:!0},visualCatatan:"Bacalah satu diagram sebagai empat kalimat: dua penjumlahan dan dua pengurangan.",simbolik:"Tuliskan 3 + 2 = 5, 5 − 2 = 3, 5 − 3 = 2. Tunjukkan bahwa semuanya memakai tiga bilangan yang sama.",contoh:{situasi:"Tiga balok merah dan dua balok biru.",langkah:["Gabungkan menjadi lima.","Ambil dua biru; tanya sisa merah.","Gambar satu number bond 5 | 3 | 2.","Ceritakan dua situasi dari diagram yang sama."],hasil:"Anak menjelaskan bahwa tambah dan kurang memakai keseluruhan dan bagian yang sama."},kesalahan:["Meminta hafal fact families tanpa kumpulan konkret (PDF).","Menganggap tambah dan kurang topik terpisah."],ringkasan:["Satu diagram, empat kalimat.","Kurang dapat dipikirkan sebagai tambah.","Tunjukkan dengan benda."],refleksi:["Dapatkah anak membuat cerita tambah dan kurang dari satu diagram?","Apakah anak menunjuk bagian dan keseluruhan?"],latihan:[{q:"Dari number bond 5 | 3 | 2, kalimat yang dapat dibuat…",o:["Hanya 3 + 2 = 5.","3 + 2 = 5, 2 + 3 = 5, 5 − 2 = 3, 5 − 3 = 2.","Hanya 5 − 2 = 3."],a:1,e:"Satu keseluruhan dan dua bagian menghasilkan satu keluarga fakta."},{q:"Mengapa tidak cukup hafalan fact family?",o:["Karena anak perlu mampu menunjuk benda untuk tiap kalimat.","Karena hafalan dilarang.","Karena fact family jarang dipakai."],a:0,e:"Pemahaman bukan hafalan; konkret diperlukan."}],tujuanKegiatan:"Anak menceritakan dua situasi (gabung dan ambil) dari satu set balok.",alat:["3 balok merah dan 2 biru","Kertas","Spidol"],persiapan:"Siapkan balok dua warna dan kertas dengan number bond kosong.",langkah:["Gabungkan balok menjadi lima.","Ambil dua biru dan tanya sisa.","Tuliskan bond dan kalimat.","Ubah urutan bagian dan ulangi."],sederhana:"Gunakan total 4 (3 dan 1) saja.",observasi:"Catat apakah anak menghubungkan tambah dan kurang pada benda yang sama.",jalur:[{k:"E",alasan:"Hubungan sebaliknya (invers) adalah ide aljabar awal."}]}};var Bn={25:{tujuan:"Anak menjumlahkan dengan menghitung semua benda dari satu, dan tahu bahwa strategi ini sah dan bermakna.",definisi:"Counting all adalah strategi penjumlahan: gabungkan dua kumpulan, lalu hitung seluruhnya dari satu. 4 + 3 dihitung satu sampai tujuh.",mengapa:"Counting all menunjukkan anak memahami total sebagai gabungan dua kumpulan. Ini titik awal yang valid sebelum strategi yang lebih efisien.",penjelasan:["Banyak orang tua ingin cepat mengganti ke strategi lain. Sebaliknya, counting all adalah langkah bermakna dan tidak perlu dipermalukan.","Anak akan sendiri mencari cara yang lebih ringkas ketika siap. Tugas orang tua adalah menyediakan kesempatan melihat cara lain tanpa mewajibkan."],visual:{type:"ops",mode:"countall",a:4,b:3},visualCatatan:"Gabungkan dua kumpulan, lalu hitung semua dari satu.",simbolik:"Tuliskan 4 + 3 = 7 bila anak memahami penggabungan.",contoh:{situasi:"Empat balok ditambah tiga balok.",langkah:["Buat empat balok dan tiga balok.","Gabungkan dan hitung satu sampai tujuh.","Tanya: “Bagaimana kamu menghitungnya?”","Tunjukkan cara lain setelah nyaman, tanpa memaksa."],hasil:"Anak menyatakan total adalah gabungan kedua kumpulan dan memakai strategi hitung dengan percaya diri."},kesalahan:["Mempermalukan anak yang belum memakai counting on (PDF).","Memaksa pindah strategi sebelum anak siap."],ringkasan:["Counting all adalah strategi sah.","Total adalah gabungan.","Perlihatkan cara lain tanpa memaksa."],refleksi:["Apakah anak menjelaskan caranya?","Cara lain apa yang dapat saya tunjukkan tanpa menekan?"],latihan:[{q:"Anak menghitung semua dari satu untuk 4 + 3. Respons yang tepat…",o:["“Itu salah, harusnya mulai dari empat.”","“Terima kasih sudah menjelaskan. Itu cara yang masuk akal.”","Menghentikan permainan."],a:1,e:"PDF: counting all bukan kesalahan."},{q:"Kapan strategi lain dikenalkan?",o:["Setelah anak nyaman, tanpa mewajibkan.","Sebelum anak mencoba.","Tidak pernah."],a:0,e:"Variasi dikenalkan sebagai pilihan, bukan kewajiban."}],tujuanKegiatan:"Anak menggabungkan dua kumpulan balok dan menghitung semuanya.",alat:["Balok dua warna","Dua piring","Kartu titik"],persiapan:"Siapkan balok (4 dan 3). Tentukan cerita sederhana.",langkah:["Buat dua kumpulan.","Gabungkan dan hitung bersama dari satu.","Ulangi dengan jumlah lain.","Tanya cara anak menghitung."],sederhana:"Gunakan 2 + 1 dan 2 + 2 dengan benda.",observasi:"Catat strategi yang dipakai anak dan apakah ia menjelaskan penggabungan."},26:{tujuan:"Anak memulai dari jumlah yang sudah diketahui, lalu melanjutkan hitungan sebanyak tambahan.",definisi:"Counting on adalah strategi: mulai dari bilangan pertama (tanpa menghitung ulang) lalu melanjutkan hitung sebanyak yang ditambah. 5 + 2: “lima… enam, tujuh”.",mengapa:"Counting on lebih ringkas daripada counting all dan menunjukkan anak memperlakukan kelompok pertama sebagai satu kesatuan.",penjelasan:["Tanda kesiapan: anak berhenti menghitung kelompok pertama dari satu. Pertanyaan pemandu: “Kalau sudah tahu ini lima, perlu menghitung yang lima dari awal?”","Lintasan papan permainan cocok: dari petak 5 maju dua langkah. Tetapi jangan menekan agar strategi ini selalu dipakai."],visual:{type:"line",mode:"on"},visualCatatan:"Mulai dari angka pertama lalu melompat sebanyak tambahan.",simbolik:"Hubungkan ke 5 + 2 = 7 ketika siap.",contoh:{situasi:"Lima balok ditambah dua.",langkah:["Tata lima balok sebagai satu kelompok.","Tambah dua balok dan lanjutkan: “enam, tujuh”.","Tanya: “Apakah perlu menghitung lima dari awal?”","Coba 4 + 1, 5 + 2, 6 + 1."],hasil:"Anak memulai dari jumlah awal dan menyebut bilangan sesudahnya."},kesalahan:["Menekan agar selalu counting on (PDF).","Mengabaikan nilai counting all."],ringkasan:["Mulai dari yang diketahui, lanjutkan hitung.","Tanda kesiapan: tidak mengulang dari satu.","Tidak wajib selalu dipakai."],refleksi:["Kapan anak mulai tidak menghitung ulang kelompok pertama?","Rentang berapa yang nyaman?"],latihan:[{q:"Anak menghitung 5 + 2 dengan “enam, tujuh”. Ini…",o:["Counting on.","Counting all.","Doubles."],a:0,e:"Mulai dari lima lalu lanjut sebanyak tambahan."},{q:"Sikap yang tepat terhadap counting on…",o:["Memaksa selalu dipakai.","Memperkenalkan sebagai pilihan dan mengakui counting all tetap bermakna.","Melarang counting all."],a:1,e:"PDF: jangan menekan."}],tujuanKegiatan:"Anak melanjutkan hitungan dari jumlah awal saat bermain papan permainan.",alat:["Papan permainan atau garis angka dari kertas","Pion","Balok"],persiapan:"Buat lintasan 1–10 dari kertas.",langkah:["Letakkan pion di petak 5.","Maju dua langkah dan sebut bilangan.","Tanya cara berpikirnya.","Ganti angka awal."],sederhana:"Mulai dari 3 dan maju satu langkah.",observasi:"Catat apakah anak memulai dari jumlah awal tanpa menghitung ulang."},27:{tujuan:"Anak mulai memilih menghitung mundur atau mencari selisih lewat penjumlahan untuk menyelesaikan pengurangan.",definisi:"Counting back adalah mundur beberapa langkah dari bilangan awal (8 − 2: tujuh, enam). Think addition adalah mencari “enam ditambah berapa jadi delapan?”.",mengapa:"Anak yang bisa memilih strategi lebih fleksibel. Hitung mundur cocok untuk pengurangan kecil, think addition cocok saat dua bilangan berdekatan.",penjelasan:["Untuk 8 − 2, mundur dua langkah mudah. Untuk 8 − 6, mundur enam langkah lebih berat; mencari “enam tambah berapa jadi delapan” lebih ringkas.","Garis angka membantu sebagai pendukung, bukan satu-satunya media. Pakai benda yang sama untuk membandingkan 8 − 2 dan 8 − 6."],visual:{type:"line",mode:"back"},visualCatatan:"Bandingkan hitung mundur dengan mencari selisih lewat penjumlahan.",simbolik:"Tulis 8 − 2 = 6 dan 6 + 2 = 8 sebagai strategi balik.",contoh:{situasi:"Delapan dikurangi dua, lalu delapan dikurangi enam.",langkah:["Geser pion mundur dua langkah dari 8.","Coba 8 − 6: tanya “enam tambah berapa jadi delapan?”.","Bandingkan cara mana lebih mudah.","Catat kedua strategi."],hasil:"Anak memilih strategi dan menjelaskan alasannya."},kesalahan:["Menganggap counting back selalu paling efisien (PDF).","Hanya memakai garis angka tanpa benda."],ringkasan:["Dua strategi: mundur atau tambah.","Pilih sesuai jarak bilangan.","Bandingkan dengan benda yang sama."],refleksi:["Strategi mana yang dipilih anak untuk 8 − 6?","Apakah anak memberi alasan memilih?"],latihan:[{q:"Untuk 8 − 6, strategi yang biasanya lebih ringkas…",o:["Mundur enam langkah.","Berpikir “enam tambah berapa jadi delapan?”","Menghitung semua."],a:1,e:"Jarak kecil lebih mudah dicari lewat penjumlahan."},{q:"Garis angka sebaiknya dipakai sebagai…",o:["Satu-satunya media.","Pendukung visual bersama benda.","Pengganti benda."],a:1,e:"PDF: bukan satu-satunya media."}],tujuanKegiatan:"Anak membandingkan hitung mundur dengan mencari selisih.",alat:["Pion dan lintasan","Balok","Kertas garis angka"],persiapan:"Siapkan lintasan 0–10 dan satu pion.",langkah:["Mulai dari 8 dan mundur dua.","Coba 8 − 6 dengan balok.","Tanya cara lebih mudah.","Ulangi dengan 9 − 2 dan 9 − 7."],sederhana:"Gunakan pengurangan satu dan dua dari 5.",observasi:"Catat strategi yang dipilih dan alasan anak."},28:{tujuan:"Anak melihat doubles sebagai dua kelompok sama banyak dan menjelaskan total, bukan hanya mengingat hasil.",definisi:"Doubles adalah penjumlahan dua bagian yang sama banyak: 3 + 3 = 6, 4 + 4 = 8.",mengapa:"Doubles menjadi titik acuan yang mudah diingat. Kelak dipakai untuk near doubles dan strategi lain.",penjelasan:["Mulai dari piring: tiga biskuit di tiap dua piring. Anak membandingkan dua kelompok dan melihat bahwa jumlahnya sama.","Hindari hanya menghafal lagu doubles. Pemahaman: dua kelompok sama, totalnya dua kali jumlah satu kelompok."],visual:{type:"doubles",near:!1},visualCatatan:"Lihat dua kelompok identik dan hitung totalnya.",simbolik:"Tulis 3 + 3 = 6 setelah anak memahami dua kelompok sama.",contoh:{situasi:"Tiga biskuit di tiap dua piring.",langkah:["Taruh tiga biskuit di piring A dan B.","Tanya: “Apa persamaan dua piring?”","Gabungkan dan hitung semuanya.","Gunakan lipat kertas atau cermin untuk simetri."],hasil:"Anak menjelaskan dua kelompok sama dan menyebut totalnya."},kesalahan:["Hanya menghafal lagu doubles (PDF).","Tidak membandingkan dua kelompok."],ringkasan:["Dua kelompok sama banyak.","Total dua kali satu kelompok.","Gunakan simetri untuk melihatnya."],refleksi:["Apakah anak menyebut “sama banyak” saat menjelaskan?","Benda apa yang paling cocok?"],latihan:[{q:"Dua piring masing-masing 3 biskuit. Total…",o:["6","5","3"],a:0,e:"3 + 3 = 6."},{q:"Mengapa tidak cukup menghafal lagu doubles?",o:["Karena pemahaman membandingkan dua kelompok sama.","Karena lagu dilarang.","Karena membosankan."],a:0,e:"Hafalan tanpa makna mudah hilang."}],tujuanKegiatan:"Anak menyusun dua kelompok sama banyak dan menghitung totalnya.",alat:["Biskuit atau kancing","Dua piring","Kertas lipat"],persiapan:"Siapkan 10 benda dan dua piring.",langkah:["Taruh jumlah sama di tiap piring.","Tanya apa yang sama.","Gabungkan dan hitung.","Coba jumlah lain (2, 4, 5)."],sederhana:"Gunakan 1 + 1, 2 + 2 dengan benda.",observasi:"Catat apakah anak menjelaskan sifat “sama banyak”."},29:{tujuan:"Anak menggunakan doubles untuk menjumlahkan dua bilangan berdekatan, misalnya 5 + 6 sebagai 5 + 5 + 1.",definisi:"Near doubles adalah jumlah dua bilangan yang selisihnya satu. 5 + 6 = (5 + 5) + 1.",mengapa:"Strategi ini memanfaatkan fakta yang sudah dikenal. Anak bernalar dengan pengetahuan lama untuk menemukan yang baru.",penjelasan:["Susun dua baris balok: lima dan enam. Tunjukkan lima berpasangan dengan lima, dan satu tersisa. Dengan begitu, 5 + 6 menjadi doubles ditambah satu.","Jangan ajarkan trik near doubles sebelum doubles bermakna."],visual:{type:"doubles",near:!0},visualCatatan:"Lihat dua baris yang selisihnya satu dan pasangkan.",simbolik:"5 + 6 = (5 + 5) + 1 = 11.",contoh:{situasi:"Baris lima dan baris enam.",langkah:["Susun dua baris.","Pasangkan satu-satu dan temukan yang tersisa.","Tulis 5 + 5 = 10 ditambah satu.","Bandingkan 4 + 5 dan 5 + 6."],hasil:"Anak menjelaskan alasan memakai doubles ditambah satu."},kesalahan:["Mengajarkan trik sebelum doubles bermakna (PDF).","Meminta hafalan tanpa susunan."],ringkasan:["Near doubles = doubles ± 1.","Gunakan susunan dua baris.","Alasan lebih penting daripada trik."],refleksi:["Apakah anak memanfaatkan doubles yang ia ketahui?","Bilangan mana yang membingungkan?"],latihan:[{q:"5 + 6 sebagai doubles ditambah satu adalah…",o:["5 + 5 + 1.","6 + 6 + 1.","5 + 1."],a:0,e:"Lima dan lima membentuk doubles, ditambah satu."},{q:"Syarat sebelum mengenalkan near doubles…",o:["Doubles sudah bermakna bagi anak.","Anak hafal 20.","Tidak ada."],a:0,e:"PDF: jangan mengajarkan sebelum doubles bermakna."}],tujuanKegiatan:"Anak menemukan bahwa dua baris berbeda satu dapat dihitung dengan doubles.",alat:["Balok","Kertas","Kartu titik"],persiapan:"Siapkan dua baris balok jumlah berdekatan.",langkah:["Susun baris 5 dan 6.","Pasangkan dan tunjukkan sisa.","Tulis doubles + satu.","Ulangi dengan 4 dan 5."],sederhana:"Gunakan 2 + 3 dan 3 + 4.",observasi:"Catat apakah anak menjelaskan penggunaan doubles."},30:{tujuan:"Anak memecah salah satu bilangan agar jumlah pertama menjadi 10, lalu menambahkan sisanya, dan dapat menjelaskan alasannya.",definisi:"Make ten adalah strategi: dari 8 + 5, pecah 5 menjadi 2 dan 3, buat 8 + 2 = 10, lalu 10 + 3 = 13.",mengapa:"Sepuluh adalah patokan sistem bilangan. Strategi ini menghubungkan komposisi hingga 10, ten-frame, dan nilai tempat.",penjelasan:["Pengalaman dengan ten-frame: isi delapan, tambahkan lima counter, dua mengisi frame, tiga sisanya. Anak melihat 10 dan 3 menjadi 13.","Jangan mempercepat teknik ini bila pasangan 10 belum bermakna. Penjelasan anak tentang mengapa 2 dan 3 lebih penting daripada langkahnya."],visual:{type:"frame",size:10,init:8,twoColor:!0},visualCatatan:"Isi hingga sepuluh, lalu lihat sisanya melewati sepuluh.",simbolik:"8 + 5 = (8 + 2) + 3 = 10 + 3 = 13.",contoh:{situasi:"Delapan di ten-frame ditambah lima counter.",langkah:["Isi delapan di ten-frame.","Ambil dua counter untuk mengisi 10.","Hitung sisa tiga di luar frame.","Tuliskan 10 + 3 = 13."],hasil:"Anak menjelaskan mengapa memilih 2 dan 3."},kesalahan:["Mempercepat make ten sebelum pasangan 10 bermakna (PDF).","Mengajarkan rumus tanpa ten-frame."],ringkasan:["Penuhi sepuluh dulu.","Pecah bilangan kedua.","Jelaskan alasan."],refleksi:["Apakah anak tahu 8 butuh 2 untuk 10?","Strategi mana yang dipilih anak sendiri?"],latihan:[{q:"Pada 8 + 5 anak memilih 2 dan 3 karena…",o:["8 butuh 2 untuk menjadi 10.","Karena 2 dan 3 mudah.","Karena ditunjuk guru."],a:0,e:"Alasan memilih 2 menunjukkan pemahaman pasangan 10."},{q:"Syarat sebelum make ten…",o:["Pasangan 10 bermakna.","Hafal 100.","Menulis cepat."],a:0,e:"PDF: jangan dipercepat."}],tujuanKegiatan:"Anak memakai ten-frame untuk menambah melewati sepuluh.",alat:["Ten-frame","Counter dua warna","Kertas"],persiapan:"Siapkan ten-frame dan counter.",langkah:["Isi delapan di ten-frame.","Tambahkan lima dan isi sampai 10.","Hitung yang tersisa.","Coba 9 + 4 dan 7 + 5."],sederhana:"Gunakan 9 + 2 dan 9 + 3 dahulu.",observasi:"Catat apakah anak memberi alasan memilih pembagian."}};var Cn={31:{tujuan:"Anak memahami bahwa sepuluh satuan dapat diperlakukan sebagai satu unit baru (satu puluhan) tanpa mengubah jumlahnya.",definisi:"Unitizing ten adalah memandang sepuluh benda lepas sebagai satu bundel “puluhan”. Isinya tetap sepuluh, tetapi cara menghitungnya berubah: satu unit puluhan, bukan sepuluh unit satuan.",mengapa:"Seluruh sistem nilai tempat bertumpu pada gagasan ini. Anak yang hanya melihat angka tanpa unit puluhan akan membaca 23 sebagai “dua dan tiga”.",penjelasan:["Ikat sepuluh stik menjadi satu bundel lalu bandingkan dengan sepuluh stik lepas. Tanyakan apakah jumlah stik berubah. Pengalaman ini membuat anak yakin bahwa bundel masih berisi sepuluh.","Jangan langsung mengajarkan “digit puluhan”. Pemahaman unit baru harus dibangun lewat benda sebelum simbol."],visual:{type:"place",mode:"unitize"},visualCatatan:"Ikat sepuluh satuan menjadi satu puluhan dan lihat bahwa jumlahnya tetap.",simbolik:"Ucapkan “10 satuan = 1 puluhan”. Simbol 10 adalah catatan dari unit baru itu.",contoh:{situasi:"Sepuluh stik lepas dan satu bundel sepuluh stik.",langkah:["Hitung sepuluh stik lepas.","Ikat menjadi satu bundel.","Tanya: “Jumlah stiknya berubah?”","Buat dua bundel dan tiga stik lepas untuk persiapan 23."],hasil:"Anak menjelaskan bahwa satu bundel tetap berisi sepuluh batang."},kesalahan:["Langsung mengajarkan digit puluhan tanpa pemahaman unit baru (PDF).","Memakai blok yang sudah jadi tanpa anak membuat bundel sendiri."],ringkasan:["Sepuluh satuan = satu puluhan.","Jumlah tetap; unitnya berubah.","Bangun dari bundel nyata."],refleksi:["Apakah anak yakin bundel berisi sepuluh tanpa menghitung ulang?","Bagaimana anak menyebut unit baru?"],latihan:[{q:"Sepuluh stik diikat menjadi satu bundel. Jumlah stik sekarang…",o:["Tetap sepuluh.","Satu.","Berkurang."],a:0,e:"Mengikat tidak mengubah jumlah."},{q:"Mengapa tidak langsung mengajarkan digit puluhan?",o:["Karena anak perlu memahami unit puluhan dengan benda dahulu.","Karena digit tidak penting.","Karena sulit ditulis."],a:0,e:"PDF: unit baru lebih dulu daripada simbol."}],tujuanKegiatan:"Anak membuat bundel sepuluh stik dan membandingkannya dengan stik lepas.",alat:["30 stik es krim atau sedotan","Karet gelang","Kertas"],persiapan:"Siapkan stik dan karet. Duduk berdampingan.",langkah:["Hitung sepuluh stik lepas.","Ikat menjadi satu bundel.","Bandingkan bundel dengan sepuluh lepas.","Buat dua bundel dan tiga stik lepas."],sederhana:"Hanya satu bundel dan beberapa stik lepas.",observasi:"Catat apakah anak menyatakan jumlah tetap sepuluh dan memakai kata “puluhan”."},32:{tujuan:"Anak membaca bilangan dua digit sebagai puluhan dan satuan, serta memahami nilai digit bergantung pada posisinya.",definisi:"Place value: nilai sebuah digit ditentukan oleh posisinya. Pada 34, digit 3 bernilai 30 (tiga puluhan) dan digit 4 bernilai 4 (empat satuan).",mengapa:"Nilai tempat adalah dasar tambah, kurang, dan bilangan besar. Anak yang hanya menghafal bentuk angka akan kesulitan pada penjumlahan bersusun.",penjelasan:["Susun tiga bundel sepuluh dan empat stik lepas. Minta anak menyebut berapa bundel dan berapa stik, lalu hubungkan ke 34.","Bandingkan 24 dan 42 dengan benda yang sama untuk melihat posisi memengaruhi nilai."],visual:{type:"place",mode:"place"},visualCatatan:"Ubah banyak puluhan dan satuan, perhatikan bilangan yang terbentuk.",simbolik:"Tuliskan 34 = 30 + 4, bukan 3 + 4.",contoh:{situasi:"Tiga bundel dan empat stik lepas.",langkah:["Susun tiga bundel dan empat stik.","Tanya: “Berapa ak dan isi.","Ubah salah satu dan minta perbaiki.","Gambar lingkaran dan titik."],sederhana:"Dua kelompok berisi dua.",observasi:"Catat apakah anak membedakan banyak kelompok dan isinya.",jalur:[{k:"E",alasan:"Kelompok berulang mengarah ke pola dan struktur."}]},37:{tujuan:"Anak menghubungkan penjumlahan berulang dengan kelompok berukuran sama.",definisi:"Repeated addition adalah menjumlahkan kelompok sama besar: 2 + 2 + 2 = 6.",mengapa:"Ini jembatan dari penjumlahan menuju perkalian. Anak melihat perkalian sebagai ringkasan penjumlahan kelompok sama.",penjelasan:["Buat tiga kelompok berisi dua. Hitung tiap kelompok lalu total. Tuliskan 2 + 2 + 2 = 6.","Perkalian tidak hanya penjumlahan berulang. Kelak array dan struktur lain memperluasnya."],visual:{type:"group",mode:"repeat",k:3,m:2},visualCatatan:"Tambahkan kelompok satu per satu dan lihat jumlah berulang.",simbolik:"2 + 2 + 2 = 6; hubungkan ke 3 × 2 = 6 setelah siap.",contoh:{situasi:"Tiga kelompok berisi dua balok.",langkah:["Buat tiga kelompok dua balok.","Hitung tiap kelompok lalu total.","Tulis 2 + 2 + 2 = 6.","Bandingkan dengan 3 + 3."],hasil:"Anak menghubungkan penjumlahan berulang dengan kelompok sama."},kesalahan:["Menganggap perkalian hanyalah penjumlahan berulang (PDF).","Memakai kelompok tidak sama."],ringkasan:["Kelompok sama = penjumlahan berulang.","Dua cara untuk total sama.","Perkalian lebih luas daripada itu."],refleksi:["Dapatkah anak menyebut banyak kelompok dan isi?","Apakah ia menemukan 3 + 3 = 6?"],latihan:[{q:"2 + 2 + 2 menggambarkan…",o:["Tiga kelompok berisi dua.","Dua kelompok berisi tiga.","Satu kelompok."],a:0,e:"Tiga kali dua ditambahkan."},{q:"Mengapa perkalian tidak hanya penjumlahan berulang?",o:["Ada struktur lain seperti array.","Karena tidak ada hubungan.","Karena sulit."],a:0,e:"PDF menyebut eksplorasi array dan struktur lain."}],tujuanKegiatan:"Anak membuat kelompok sama dan menuliskan penjumlahan berulangnya.",alat:["Balok","Piring","Kertas"],persiapan:"Siapkan 12 balok dan piring.",langkah:["Buat tiga kelompok dua.","Hitung dan tulis penjumlahan.","Coba 2 + 2 + 2 dan 3 + 3.","Ceritakan situasi dari tiap penjumlahan."],sederhana:"Dua kelompok dua saja.",observasi:"Catat apakah anak menghubungkan tulisan dengan benda."},38:{tujuan:"Anak membaca susunan baris dan kolom, membedakan banyak baris, kolom, dan total, serta menyadari total tetap saat susunan diputar.",definisi:"Array adalah susunan benda dalam baris dan kolom teratur. 3 baris berisi 4 benda memiliki 12 benda; diputar menjadi 4 baris berisi 3 benda, totalnya tetap 12.",mengapa:"Array menunjukkan struktur perkalian dan memperlihatkan bahwa urutan faktor tidak mengubah total.",penjelasan:["Susun tiga baris berisi empat benda. Minta anak menyebut banyak baris, benda per baris, dan total. Putar susunan dan tanyakan apakah total berubah.","Wadah telur dan kisi karton adalah model array yang baik dan murah."],visual:{type:"array",mode:"array",r:3,c:4},visualCatatan:"Ubah baris dan kolom, lalu putar susunan.",simbolik:"3 × 4 = 12 dan 4 × 3 = 12 setelah siap.",contoh:{situasi:"Tiga baris berisi empat Lego.",langkah:["Susun tiga baris empat.","Tanya baris, isi per baris, total.","Putar susunan.","Bandingkan 3 × 4 dan 4 × 3."],hasil:"Anak membedakan baris, kolom, dan total."},kesalahan:["Mengira orientasi mengubah total (PDF).","Tidak memakai benda."],ringkasan:["Baris, kolom, total.","Putar tidak mengubah total.","Gunakan wadah telur."],refleksi:["Apakah anak menyebut baris dan kolom dengan benar?","Apakah ia yakin total tetap?"],latihan:[{q:"Array 3 × 4 diputar menjadi 4 × 3. Total…",o:["Tetap 12.","Berubah.","Menjadi 7."],a:0,e:"Orientasi tidak mengubah total."},{q:"Model array sederhana di rumah…",o:["Wadah telur.","Gelas.","Selimut."],a:0,e:"Wadah telur berbaris-kolom."}],tujuanKegiatan:"Anak membuat dan memutar array dengan benda.",alat:["Lego atau balok","Wadah telur","Kertas kotak"],persiapan:"Siapkan 12 balok dan kertas kotak.",langkah:["Susun 3 baris isi 4.","Sebut baris, kolom, total.","Putar susunan.","Gambar kisi."],sederhana:"Gunakan 2 × 3.",observasi:"Catat apakah anak membedakan baris dan kolom.",jalur:[{k:"B",alasan:"Baris dan kolom melatih orientasi ruang."}]},39:{tujuan:"Anak menjelaskan perkalian dengan benda, gambar, dan simbol, termasuk arti tiap angka.",definisi:"Perkalian merepresentasikan sejumlah kelompok sama besar: 4 kelompok berisi 3 menjadi 4 × 3 = 12.",mengapa:"Memahami arti tiap faktor mencegah perkalian jadi hafalan tanpa makna.",penjelasan:["Empat piring masing-masing tiga benda. Tanya arti angka empat, arti angka tiga, dan asal dua belas.","Hafalan tabel bukan satu-satunya cara memahami. Bangun beberapa cerita berbeda untuk 3 × 4 dan 4 × 3."],visual:{type:"group",mode:"equal",k:4,m:3},visualCatatan:"Ubah banyak kelompok dan isinya, lihat hasil kalinya.",simbolik:"4 × 3 = 12 dan jelaskan faktor sesuai konteks.",contoh:{situasi:"Empat piring masing-masing tiga benda.",langkah:["Susun empat piring dengan tiga benda.","Tanya arti empat dan tiga.","Gambar lingkaran dan titik.","Tulis 4 × 3 = 12."],hasil:"Anak menjelaskan operasi dengan benda, gambar, dan simbol."},kesalahan:["Memulai dari hafalan tabel (PDF).","Tidak menjelaskan arti faktor."],ringkasan:["Banyak kelompok × isi.","Tiga representasi.","Cerita berbeda untuk faktor tertukar."],refleksi:["Dapatkah anak menjelaskan arti tiap angka?","Cerita apa untuk 3 × 4?"],latihan:[{q:"Pada 4 × 3, angka 3 dapat berarti…",o:["Isi tiap kelompok.","Total.","Sisa."],a:0,e:"Dalam konteks empat kelompok isi tiga."},{q:"Hafalan tabel sebaiknya…",o:["Menyusul pemahaman.","Satu-satunya cara.","Dilarang."],a:0,e:"PDF: jangan satu-satunya cara."}],tujuanKegiatan:"Anak menyusun kelompok sama dan menulis perkaliannya.",alat:["Piring","Balok","Kertas"],persiapan:"Siapkan 12 balok.",langkah:["Buat empat kelompok tiga.","Tanya arti angka.","Gambar dan tulis.","Buat cerita lain."],sederhana:"Gunakan 2 × 3.",observasi:"Catat apakah anak menjelaskan arti faktor.",jalur:[{k:"E",alasan:"Struktur perkalian dan hubungan terbalik mengarah ke aljabar."}]},40:{tujuan:"Anak memahami pembagian saat banyak penerima diketahui dan isi tiap bagian dicari, serta arti hasilnya.",definisi:"Partitive division (berbagi): jumlah penerima diketahui, jumlah per penerima dicari. 12 ÷ 3 = 4 berarti tiap penerima mendapat 4.",mengapa:"Berbagi adalah gambaran paling dekat dengan pengalaman anak. Hasil adalah isi tiap kelompok.",penjelasan:["Bagikan 12 balok bergantian ke tiga boneka dan hitung isi tiap boneka.","Jangan mencampur dengan pembagian jenis kedua (Tahap 41): di sini yang diketahui banyak penerima, yang dicari isi tiap penerima."],visual:{type:"share",n:12,k:3},visualCatatan:"Bagikan balok kepada penerima dan lihat isi tiap bagian.",simbolik:"12 ÷ 3 = 4 setelah anak menjelaskan isi tiap kelompok.",contoh:{situasi:"12 balok untuk 3 boneka.",langkah:["Bagikan bergantian satu per satu.","Hitung isi tiap boneka.","Tanya arti angka empat.","Bandingkan 9 dan 12 untuk 3 penerima."],hasil:"Anak menyatakan 4 sebagai isi tiap penerima."},kesalahan:["Mencampur besaran yang diketahui dan ditanyakan antara dua jenis pembagian (PDF).","Menyebut hasil sebagai banyak penerima."],ringkasan:["Penerima diketahui, isi dicari.","Hasil = isi tiap kelompok.","Bandingkan beberapa jumlah."],refleksi:["Apakah anak menyebut hasil sebagai isi?","Apakah ia membedakan dari pembagian jenis kedua?"],latihan:[{q:"12 balok untuk 3 boneka. Hasil 4 berarti…",o:["Tiap boneka mendapat 4.","Ada 4 boneka.","Sisa 4."],a:0,e:"Hasil adalah isi tiap kelompok."},{q:"Yang diketahui pada pembagian jenis berbagi…",o:["Banyak penerima.","Isi tiap kelompok.","Sisa."],a:0,e:"Banyak penerima diketahui."}],tujuanKegiatan:"Anak membagi balok ke penerima dan menyebut isi tiap penerima.",alat:["Balok","Tiga boneka","Piring"],persiapan:"Siapkan 12 balok dan tiga boneka.",langkah:["Bagikan satu per satu.","Hitung milik tiap boneka.","Gambar tiga lingkaran.","Coba 9 dan 12 benda."],sederhana:"Bagi 6 benda untuk 2 boneka.",observasi:"Catat apakah anak menyebut hasil sebagai isi per penerima."},41:{tujuan:"Anak memahami pembagian saat isi tiap kelompok diketahui dan banyak kelompok dicari.",definisi:"Quotitive division (mengelompokkan): ukuran tiap kelompok diketahui, jumlah kelompok dicari. 12 benda dikelompokkan 3-3 menghasilkan 4 kelompok.",mengapa:"Dua tafsir pembagian harus dikenali agar anak memahami makna 12 ÷ 3 dalam dua cerita berbeda.",penjelasan:["Siapkan 12 balok dan buat kumpulan berisi tiga; hitung banyak kelompok. Hasil adalah jumlah kelompok.","Bandingkan dengan Tahap 40: di sana hasil adalah isi tiap bagian, di sini hasil adalah banyak kelompok."],visual:{type:"group",mode:"quotitive",k:4,m:3},visualCatatan:"Kelompokkan benda sebanyak ukuran dan hitung banyak kelompok.",simbolik:"12 ÷ 3 = 4 dan jelaskan 4 sebagai banyak kelompok.",contoh:{situasi:"12 balok dikelompokkan 3-3.",langkah:["Buat kumpulan berisi tiga.","Hitung banyak kelompok.","Tanya: “Berapa kotak yang diperlukan?”","Coba total 15 dan ukuran 5."],hasil:"Anak membedakan “isi kelompok” dari “banyak kelompok”."},kesalahan:["Memberi hanya satu bentuk cerita pembagian (PDF).","Tidak membedakan dengan Tahap 40."],ringkasan:["Isi diketahui, banyak kelompok dicari.","Hasil = banyak kelompok.","Dua tafsir untuk 12 ÷ 3."],refleksi:["Dapatkah anak menyebut dua tafsir?","Cerita apa untuk tiap tafsir?"],latihan:[{q:"12 balok dikelompokkan 3-3. Hasil 4 berarti…",o:["Banyak kelompok.","Isi tiap kelompok.","Sisa."],a:0,e:"Banyak kelompok yang dicari."},{q:"Perbedaan dengan berbagi…",o:["Isi diketahui, kelompok dicari.","Tidak ada.","Selalu ada sisa."],a:0,e:"Dua tafsir pembagian."}],tujuanKegiatan:"Anak mengelompokkan benda dengan ukuran tetap dan menghitung banyak kelompok.",alat:["Balok","Kotak kecil","Kertas"],persiapan:"Siapkan 12 balok dan beberapa kotak.",langkah:["Buat kumpulan tiga.","Hitung banyak kelompok.","Gambar dan lingkari.","Coba 15 dan 5."],sederhana:"Kelompokkan 6 benda dua-dua.",observasi:"Catat apakah anak membedakan banyak kelompok dan isinya."},42:{tujuan:"Anak menjelaskan hubungan terbalik perkalian dan pembagian dari satu susunan fisik.",definisi:"Dari satu array 3 × 4 = 12 dapat dibaca 12 ÷ 3 = 4 dan 12 ÷ 4 = 3. Perkalian dan pembagian saling membalik.",mengapa:"Hubungan ini membuat pembagian dapat dipikirkan sebagai mencari faktor yang hilang dan menyatukan empat tahap sebelumnya.",penjelasan:["Buat tiga baris isi empat. Ubah sudut pandang: total 12, tiga kelompok, tiap empat; atau empat kelompok, tiap tiga.","Jangan menilai benar bila anak hanya menghafal tiga persamaan tanpa makna. Minta anak menunjuk bagian susunan untuk tiap persamaan."],visual:{type:"array",mode:"inverse",r:3,c:4},visualCatatan:"Lihat satu array dibaca sebagai perkalian dan dua pembagian.",simbolik:"3 × 4 = 12; 12 ÷ 3 = 4; 12 ÷ 4 = 3.",contoh:{situasi:"Array 3 × 4.",langkah:["Susun array tiga baris empat.","Tanya total, banyak kelompok, isi tiap kelompok.","Tandai 12 ÷ 3 dan 12 ÷ 4.","Buat cerita berbagi dan mengelompokkan."],hasil:"Anak menjelaskan relasi lewat susunan fisik."},kesalahan:["Menilai benar bila hanya menghafal tiga persamaan (PDF).","Tidak memakai benda."],ringkasan:["Satu array, tiga persamaan.","Hubungan terbalik.","Jelaskan lewat susunan."],refleksi:["Dapatkah anak menunjuk bagian array untuk tiap persamaan?","Cerita apa yang dibuat anak?"],latihan:[{q:"Dari array 3 × 4, 12 ÷ 4 sama dengan…",o:["3","4","12"],a:0,e:"Dua belas dibagi empat kelompok isi tiga."},{q:"Anak menghafal tiga persamaan tapi tidak dapat menunjuk array. Artinya…",o:["Perlu pengalaman fisik lagi.","Sudah paham.","Persamaan salah."],a:0,e:"PDF: relasi dijelaskan lewat susunan fisik."}],tujuanKegiatan:"Anak membaca satu array sebagai perkalian dan dua pembagian.",alat:["Balok","Kertas kotak","Wadah telur"],persiapan:"Siapkan 12 balok dan kertas kotak.",langkah:["Susun 3 × 4.","Tanya perubahan sudut pandang.","Tandai persamaan.","Buat cerita sharing dan grouping."],sederhana:"Gunakan 2 × 3.",observasi:"Catat apakah anak menjelaskan lewat susunan.",jalur:[{k:"E",alasan:"Hubungan invers adalah ide aljabar awal."}]}};var Dn={A:{pengantar:"Geometri prasekolah adalah bermain dengan bentuk: memasangkan, memutar, menggabungkan, dan memecah. Fokusnya mengenali bentuk dari sifatnya, bukan dari gambar “standar” yang biasa dilihat.",langkah:[{penjelasan:"Mulai dengan memasangkan bentuk yang sama, lalu bentuk yang mirip tetapi berbeda ukuran atau posisi. Anak belajar melihat apa yang membuat bentuk “sama”.",aktivitas:"Cocokkan tutup wadah dengan wadahnya, atau potongan karton dengan bayangannya di kertas."},{penjelasan:"Kenalkan lingkaran, segitiga, persegi, dan persegi panjang dari benda sehari-hari. Beri berbagai contoh (segitiga tinggi, miring, lebar) agar anak tidak hafal satu gambar.",aktivitas:"Cari bentuk di rumah: jam dinding, atap, jendela, nampan."},{penjelasan:"Bandingkan sisi dan sudut dengan bahasa informal: “lurus atau melengkung”, “ada berapa ujung yang runcing”. Ini awal dari sifat bentuk.",aktivitas:"Raba bentuk dari karton dengan mata tertutup lalu sebutkan cirinya."},{penjelasan:"Putar dan balik bentuk agar anak tahu segitiga tetap segitiga walaupun posisinya berubah. Ini mencegah hafalan prototipe.",aktivitas:"Putar segitiga di atas kertas dan tanya: “Masih segitiga? Apa yang tetap sama?”"},{penjelasan:"Menggabungkan dua bentuk menjadi bentuk lain dan memecah bentuk menjadi bagian. Aktivitas ini menghubungkan geometri dengan part–whole.",aktivitas:"Susun dua segitiga menjadi persegi, lalu pisahkan lagi dengan berbagai cara."},{penjelasan:"Benda tiga dimensi: bola, kubus, kotak, kerucut. Anak mulai membedakan yang dapat menggelinding dan yang dapat ditumpuk.",aktivitas:"Menara dari benda: mana yang bisa ditumpuk, mana yang menggelinding?"},{penjelasan:"Sifat bentuk formal (jumlah sisi, sudut, simetri) adalah materi lanjutan. Perkenalkan hanya jika anak tertarik dan siap.",aktivitas:"Hitung sisi dan sudut bentuk sederhana sebagai permainan, tanpa target."}],hubungan:[{tahap:1,alasan:"Memasangkan bentuk adalah pengalaman korespondensi dan persamaan."},{tahap:2,alasan:"Mengelompokkan bentuk menurut sifat melatih klasifikasi."},{tahap:3,alasan:"Membandingkan sisi dan sudut adalah perbandingan atribut."},{tahap:17,alasan:"Menggabung dan memecah bentuk adalah part–whole."},{tahap:38,alasan:"Susunan persegi menyiapkan pemahaman array."}],lanjutan:["Sifat bentuk formal: sisi, sudut, simetri.","Bangun datar dan ruang yang lebih beragam.","Menggambar dan menyusun bentuk dengan ketepatan lebih tinggi."],kesalahan:["Hanya memakai satu gambar “standar” untuk tiap bentuk.","Menilai anak salah ketika bentuk berada pada orientasi tidak biasa."],refleksi:["Apakah anak mengenali bentuk dari sifatnya atau hanya dari posisi biasa?","Apakah saya sudah memutar bentuk di depan anak?"]},B:{pengantar:"Penalaran ruang adalah memahami posisi, arah, dan sudut pandang. Anak belajar menggunakan kata “di dalam”, “di atas”, “di antara”, hingga mengikuti petunjuk dan peta sederhana.",langkah:[{penjelasan:"Mulai dengan pengalaman tubuh: masuk ke kotak, keluar dari kotak. Kata “di dalam” dan “di luar” melekat pada pengalaman nyata.",aktivitas:"Taruh mainan di dalam dan di luar kotak dan minta anak menyebutnya."},{penjelasan:"Posisi vertikal: di atas, di bawah. Gunakan tangga, meja, dan rak untuk memperlihatkan perbedaannya.",aktivitas:"Letakkan mobil di atas meja lalu di bawahnya."},{penjelasan:"Depan dan belakang bergantung pada arah benda atau orang. Gunakan boneka yang menghadap ke arah berbeda.",aktivitas:"Siapa di depan, siapa di belakang saat boneka berbaris?"},{penjelasan:"Dekat dan jauh bersifat relatif dan perlu pembanding. Biarkan anak memilih benda yang “lebih dekat” dari dua pilihan.",aktivitas:"Lempar bola ke dekat dan jauh dari keranjang."},{penjelasan:"Di samping dan di antara menyiapkan anak memahami hubungan tiga benda sekaligus.",aktivitas:"Taruh mobil di antara dua kotak, lalu di samping kotak."},{penjelasan:"Kiri dan kanan dikenalkan bertahap karena sulit bagi anak kecil. Mulai dari tubuh anak sendiri.",aktivitas:"Angkat tangan kanan, lalu tunjuk kaki kiri."},{penjelasan:"Posisi relatif dari sudut pandang berbeda: apa yang kiri bagi anak mungkin kanan bagi orang tua.",aktivitas:"Duduk berhadapan dan tanya di mana posisi kotak bagi masing-masing."},{penjelasan:"Mengikuti dan memberi petunjuk arah, hingga peta sederhana. Anak menggunakan bahasa ruang secara aktif.",aktivitas:"Buat jalur rintangan dan peta kertas sederhana, lalu saling memberi petunjuk."}],hubungan:[{tahap:1,alasan:"Menempatkan satu benda di satu tempat menyiapkan korespondensi."},{tahap:4,alasan:"Kata “sebelum”, “sesudah”, “di antara” dipakai untuk urutan."},{tahap:13,alasan:"Posisi di baris dan kotak terkait dengan petunjuk dan simbol."},{tahap:38,alasan:"Baris dan kolom memerlukan orientasi ruang."}],lanjutan:["Peta dengan simbol dan skala sederhana.","Koordinat atau kisi.","Rotasi dan refleksi bentuk."],kesalahan:["Menuntut kiri–kanan sebelum anak siap.","Hanya memakai petunjuk dari sudut pandang orang tua."],refleksi:["Kata ruang mana yang sudah dipakai anak sendiri?","Apakah anak dapat memberi petunjuk, bukan hanya mengikuti?"]},C:{pengantar:"Pengukuran mengajarkan bahwa panjang, tinggi, dan berat dapat dibandingkan dan diukur dengan unit. Prasekolah memakai unit tidak baku dulu; satuan baku dan alat ukur adalah materi lanjutan.",langkah:[{penjelasan:"Kenali atribut: apa yang diukur, panjang, tinggi, atau berat? Anak belajar memilih atribut yang relevan.",aktivitas:"Tanya “yang mana lebih tinggi?” dan “yang mana lebih berat?” untuk benda yang sama."},{penjelasan:"Bandingkan langsung dengan titik awal yang sama agar hasilnya adil.",aktivitas:"Jajarkan dua pita dari garis awal yang sama."},{penjelasan:"Perbandingan tak langsung memakai perantara: tali yang menandai panjang meja lalu dibandingkan dengan rak.",aktivitas:"Potong tali sepanjang meja dan ukur apakah sama dengan sisi sofa."},{penjelasan:"Mengukur dengan unit tidak baku, misalnya balok atau telapak tangan, sambil menghitung berapa unit.",aktivitas:"Berapa balok panjang meja? Ulangi dengan telapak tangan."},{penjelasan:"Unit harus sama besar agar hasilnya bermakna. Balok berbeda ukuran menghasilkan hitungan berbeda.",aktivitas:"Ukur dengan balok sama besar, lalu campur ukuran dan bandingkan."},{penjelasan:"Unit diletakkan tanpa celah dan tanpa tumpang tindih agar total akurat.",aktivitas:"Susun balok rapat dari ujung ke ujung."},{penjelasan:"Satuan baku (sentimeter) dan alat ukur adalah lanjutan; kenalkan ketika anak memahami perlunya unit sama.",aktivitas:"Perkenalkan penggaris sebagai “deretan unit sama” bila anak siap."}],hubungan:[{tahap:3,alasan:"Membandingkan atribut adalah dasar pengukuran."},{tahap:4,alasan:"Mengurutkan benda menurut panjang atau tinggi."},{tahap:7,alasan:"Menghitung jumlah unit membutuhkan korespondensi satu-satu."},{tahap:12,alasan:"Membandingkan hasil pengukuran adalah perbandingan jumlah."},{tahap:14,alasan:"Garis angka dan penggaris menghubungkan urutan bilangan dengan ruang."}],lanjutan:["Satuan baku: cm, meter, gram.","Alat ukur: penggaris, timbangan.","Perkiraan dan membandingkan hasil."],kesalahan:["Memakai unit berbeda ukuran tanpa menyadari akibatnya.","Membiarkan celah atau tumpang tindih antar unit."],refleksi:["Apakah anak memahami unit harus sama besar?","Apakah deret unit rapat tanpa celah?"]},D:{pengantar:"Data dan klasifikasi memperkenalkan cara mengumpulkan, mengorganisasi, dan membaca informasi sederhana. Anak belajar bahwa satu tanda mewakili satu jawaban.",langkah:[{penjelasan:"Mulai dengan mengelompokkan benda atau pilihan menurut aturan.",aktivitas:"Kelompokkan mainan: boneka, mobil, balok."},{penjelasan:"Susun pertanyaan survei yang sederhana dan jelas dengan pilihan terbatas.",aktivitas:"“Buah apa yang paling kamu suka: apel, pisang, jeruk?”"},{penjelasan:"Kumpulkan satu respons per orang. Aturan satu orang satu jawaban menjaga data bermakna.",aktivitas:"Tiap anggota keluarga
